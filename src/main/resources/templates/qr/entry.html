<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR 안내</title>

    <style>
        body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans KR", Arial, sans-serif; }
        .wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: #f7f7f8; }
        .card { width: 100%; max-width: 420px; background: #fff; border-radius: 16px; padding: 22px; box-shadow: 0 6px 18px rgba(0,0,0,0.08); }
        .title { margin: 0 0 10px; font-size: 20px; }
        .desc { margin: 0 0 16px; color: #555; line-height: 1.5; }
        .hint { font-size: 13px; color: #777; margin: 0 0 18px; }
        .actions { display: flex; gap: 10px; }
        .btn { flex: 1; display: inline-block; text-align: center; padding: 12px 14px; border-radius: 12px; text-decoration: none; font-weight: 600; }
        .btn-primary { background: #111827; color: #fff; }
        .btn-ghost { background: #eef2f7; color: #111827; }
        .error { margin: 0 0 12px; padding: 10px 12px; border-radius: 12px; background: #fff5f5; color: #b42318; font-size: 14px; border: 1px solid #ffd5d5; }
    </style>
</head>
<body>
<div class="wrap">
    <div class="card">
        <h1 class="title">다시 QR로 접속해주세요</h1>

        <!-- 필요하면 ?error=invalid 같은 경우에만 메시지 노출 -->
        <p class="error" th:if="${param.error != null}">
            유효하지 않은 QR이거나 인증 정보가 만료되었습니다.
        </p>

        <p class="desc">
            매장 테이블에 있는 QR 코드를 다시 스캔해 접속해주세요.
        </p>

        <p class="hint">
            같은 브라우저에서 여러 탭을 사용 중이라면, QR로 먼저 접속한 탭에서 다시 시도해보세요.
        </p>

<!--        <div class="actions">-->
<!--            <a class="btn btn-ghost" href="javascript:history.back()">뒤로가기</a>-->
<!--            <a class="btn btn-primary" th:href="@{/qr}">새로고침</a>-->
<!--        </div>-->
    </div>
</div>
</body>
</html>
