<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>피카통 오더</title>

    <link rel="stylesheet" href="/css/user-unified.css" />
    <script src="https://kit.fontawesome.com/a3ff865f92.js" crossorigin="anonymous"></script>
</head>

<body class="user">
<div th:replace="~{fragments/nav :: nav(${navTitle}, ${navBack}, ${tableNum}, true)}"></div>

<div class="user-orders">
    <p class="user-orders__empty" th:if="${orders == null || #lists.isEmpty(orders)}">주문 내역이 없습니다.</p>

    <div th:if="${orders != null && !#lists.isEmpty(orders)}">
        <section class="user-orders__section" th:each="order, st : ${orders}">
            <div class="user-orders__card">
                <div class="user-orders__head">
                    <span class="user-orders__label" th:text="${st.index == 0} ? '최근 주문' : '이전 주문'">최근 주문</span>
                    <span class="user-orders__time" th:text="${#temporals.format(order.createdAt, 'HH:mm')}">00:00</span>
                </div>

                <div class="user-orders__item" th:each="oi : ${order.orderItems}">
                    <span class="user-orders__itemname"
                          th:text="${oi.item.name} + ' x' + ${oi.quantity}">메뉴 x1</span>
                    <span class="user-orders__itemprice"
                          th:text="${#numbers.formatInteger(oi.orderPrice * oi.quantity, 0, 'COMMA')} + '원'">0원</span>
                </div>

                <div class="user-orders__foot">
                    <span class="user-orders__total">합계</span>
                    <span class="user-orders__total u-highlight"
                          th:text="${#numbers.formatInteger(order.totalAmount, 0, 'COMMA')} + '원'">0원</span>
                </div>
            </div>
        </section>
    </div>
</div>
</body>
</html>
