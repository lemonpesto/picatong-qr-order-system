<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>장바구니</title>

    <link rel="stylesheet" href="/css/user-unified.css" />
    <script src="https://kit.fontawesome.com/a3ff865f92.js" crossorigin="anonymous"></script>
</head>

<body class="user">
<div th:replace="~{fragments/nav :: nav(${navTitle}, ${navBack}, ${tableNum}, true)}"></div>
<div th:replace="~{fragments/toast :: toast}"></div>

<!-- 빈 장바구니 -->
<section id="empty-cart" class="user-cart user-cart__empty"
         th:classappend="${#lists.isEmpty(cartItems)} ? '' : 'u-hidden'">
    <div class="user-inline">
        <p class="user-inline__text">장바구니가 비었습니다.</p>
        <a th:href="@{/items}" class="u-btn u-btn--outline user-inline__btn" style="max-width: 220px;">메뉴 보러가기</a>
    </div>
</section>

<!-- 에러 메시지 표시 -->
<div th:if="${error}" class="user-alert user-alert--error">
    <i class="fas fa-exclamation-circle"></i>
    <span th:text="${error}">에러 메시지</span>
</div>

<!-- 장바구니 리스트 -->
<section id="non-empty-cart" class="user-cart user-cart__list"
         th:classappend="${#lists.isEmpty(cartItems)} ? 'u-hidden' : ''">

    <h3 class="user-cart__summary">
        선택한 메뉴 <span id="total-qty" th:text="${summary.totalQuantity}" style="color:#FF8C00FF;">0</span>개
    </h3>

    <div th:each="ci, stat : ${cartItems}">
        <div class="user-cart__row js-cart-row"
             th:attr="data-itemid=${ci.item.id}, data-name=${ci.item.name}, data-price=${ci.item.price}">
            <div class="user-cart__info">
                <h4 class="user-cart__name" th:text="${ci.item.name}">메뉴명</h4>
                <p class="user-cart__price">
                    <span th:text="${#numbers.formatInteger(ci.item.price, 0, 'COMMA')}">0</span>원
                </p>

                <span class="user-cart__desc"
                      th:if="${ci.item.description != null and !#strings.isEmpty(ci.item.description)}"
                      th:text="${ci.item.description}">설명</span>
            </div>

            <div class="user-qty">
                <button type="button" class="user-qty__btn js-minus" th:attr="data-itemid=${ci.item.id}">
                    <i class="fa-regular fa-trash-can"
                       th:classappend="${ci.quantity > 1} ? 'u-hidden' : ''"></i>
                    <i class="fa-solid fa-minus"
                       th:classappend="${ci.quantity <= 1} ? 'u-hidden' : ''"></i>
                </button>

                <span class="user-qty__value js-qty"
                      th:attr="data-itemid=${ci.item.id}"
                      th:text="${ci.quantity}">1</span>

                <button type="button" class="user-qty__btn js-plus" th:attr="data-itemid=${ci.item.id}">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </div>
        </div>

        <span th:unless="${stat.last}" class="u-divider u-divider--hair"></span>
    </div>
</section>

<span id="section-divider" class="u-divider" th:if="${!#lists.isEmpty(cartItems)}"></span>

<!-- 주문하기 버튼 -->
<div id="bottom-bar" th:if="${!#lists.isEmpty(cartItems)}" class="user-bottombar">
    <form th:action="@{/orders}" method="post" class="u-btn u-btn--primary user-bottombar__btn">
        <button type="submit" id="order" class="u-btn u-btn--primary">
            총&nbsp;<span id="total-amount" th:text="${#numbers.formatInteger(summary.totalAmount, 0, 'COMMA')}">0</span>원 주문하기
        </button>
    </form>

</div>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script th:src="@{/js/toast.js}"></script>

<script th:inline="javascript">
    const tableId = /*[[${tableId}]]*/ null;

    const WS = {
        url: '/ws',
        topics: {
            nav:  (tableId) => `/topic/tables/${tableId}/nav`,
            cart: (tableId) => `/topic/tables/${tableId}/cart`,
        },
    };

    let navStomp = null;
    let cartStomp = null;

    const pending = new Set();
    let reloading = false;

    const safeJson = (str) => { try { return JSON.parse(str); } catch { return null; } };
    const setText = (id, value) => { const el = document.getElementById(id); if (el) el.textContent = value; };
    const formatComma = (n) => Number(n ?? 0).toLocaleString('ko-KR');
    const cssEscape = (v) => String(v).replaceAll('"', '\\"');
    const hasTable = () => !!tableId;
    const disconnectQuietly = (client) => { try { client?.disconnect(); } catch (e) {} };
    const scheduleReload = () => { if (reloading) return; reloading = true; window.location.reload(); };

    const createStompClient = () => {
        const socket = new SockJS(WS.url);
        const client = Stomp.over(socket);
        client.debug = null;
        return client;
    };

    const connectNavTopic = () => {
        if (!hasTable()) return;
        navStomp = createStompClient();
        navStomp.connect({}, () => {
            navStomp.subscribe(WS.topics.nav(tableId), onNavMessage);
        });
    };

    const onNavMessage = (frame) => {
        const evt = safeJson(frame.body);
        if (!evt) return;

        if (evt.type === 'REDIRECT' && evt.data?.url) {
            window.location.replace(evt.data.url);
            return;
        }
        if (evt.type === 'INFO' && evt.data?.message) {
            showToast(evt.data.message);
        }
    };

    const connectCartTopic = () => {
        if (!hasTable()) return;
        cartStomp = createStompClient();
        cartStomp.connect({}, () => {
            cartStomp.subscribe(WS.topics.cart(tableId), onCartMessage);
        });
    };

    const onCartMessage = (frame) => {
        const evt = safeJson(frame.body);
        if (!evt || evt.type !== 'CART_UPDATED') return;
        applyCartSync(evt.data);
        pending.clear();
    };

    function showEmptyCartUI() {
        document.getElementById('empty-cart')?.classList.remove('u-hidden');
        document.getElementById('non-empty-cart')?.classList.add('u-hidden');
        removeBottomBar();
    }

    function showNonEmptyCartUI() {
        document.getElementById('empty-cart')?.classList.add('u-hidden');
        document.getElementById('non-empty-cart')?.classList.remove('u-hidden');
    }

    const removeBottomBar = () => {
        document.getElementById('bottom-bar')?.remove();
        document.getElementById('section-divider')?.remove();
    };

    const toggleMinusIcon = (itemId, qty) => {
        const row = document.querySelector(`.js-cart-row[data-itemid="${cssEscape(itemId)}"]`);
        if (!row) return;

        const trash = row.querySelector('.fa-trash-can');
        const minus = row.querySelector('.fa-minus');
        if (!trash || !minus) return;

        if (qty <= 1) {
            trash.classList.remove('u-hidden');
            minus.classList.add('u-hidden');
        } else {
            trash.classList.add('u-hidden');
            minus.classList.remove('u-hidden');
        }
    };

    const updateSummaryFromDom = () => {
        const rows = document.querySelectorAll('.js-cart-row[data-itemid]');
        let totalQty = 0;
        let totalAmount = 0;

        rows.forEach((row) => {
            const price = Number(row.getAttribute('data-price') || '0');
            const qtyEl = row.querySelector('.js-qty');
            const qty = Number(qtyEl?.textContent || '0');

            totalQty += qty;
            totalAmount += price * qty;
        });

        setText('total-qty', String(totalQty));
        setText('total-amount', formatComma(totalAmount));
    };

    const removeCartRowFromDom = (itemId) => {
        const row = document.querySelector(`.js-cart-row[data-itemid="${cssEscape(itemId)}"]`);
        if (!row) return;

        const next = row.nextElementSibling;
        if (next && next.classList.contains('u-divider--hair')) next.remove();
        else {
            const prev = row.previousElementSibling;
            if (prev && prev.classList.contains('u-divider--hair')) prev.remove();
        }
        row.remove();
    };

    const updateQty = async (itemId, qty) => {
        const res = await fetch(`api/cart/items/${encodeURIComponent(itemId)}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ qty }),
        });
        if (!res.ok) throw new Error(await res.text());
    };

    const deleteItem = async (itemId) => {
        const res = await fetch(`api/cart/items/${encodeURIComponent(itemId)}`, { method: 'DELETE' });
        if (!res.ok) throw new Error(await res.text());
    };

    const applyCartSync = (sync) => {
        const summary = sync?.summary || { totalQuantity: 0, totalAmount: 0 };
        const items = Array.isArray(sync?.items) ? sync.items : [];

        setText('total-qty', String(summary.totalQuantity ?? 0));
        setText('total-amount', formatComma(summary.totalAmount ?? 0));

        const totalQty = summary.totalQuantity ?? 0;
        if (totalQty <= 0 || items.length === 0) {
            showEmptyCartUI();
            return;
        }
        showNonEmptyCartUI();

        const domIds = new Set(
            Array.from(document.querySelectorAll('.js-cart-row[data-itemid]'))
                .map((el) => String(el.getAttribute('data-itemid')))
        );
        const incomingIds = new Set(items.map((line) => String(line.itemId)));

        if (domIds.size !== incomingIds.size) { scheduleReload(); return; }
        for (const id of incomingIds) { if (!domIds.has(id)) { scheduleReload(); return; } }

        const incomingMap = new Map(items.map((line) => [String(line.itemId), line]));
        document.querySelectorAll('.js-cart-row[data-itemid]').forEach((row) => {
            const id = String(row.getAttribute('data-itemid'));
            const line = incomingMap.get(id);
            if (!line) return;

            const qtySpan = row.querySelector(`.js-qty[data-itemid="${cssEscape(id)}"]`);
            if (qtySpan) qtySpan.textContent = String(line.quantity);
            toggleMinusIcon(id, Number(line.quantity));
        });
    };

    const handleQtyClick = async (e) => {
        const plusBtn  = e.target.closest('.js-plus');
        const minusBtn = e.target.closest('.js-minus');
        if (!plusBtn && !minusBtn) return;

        const btn = plusBtn || minusBtn;
        const itemId = btn.getAttribute('data-itemid');
        if (!itemId) return;

        if (pending.has(itemId)) return;
        pending.add(itemId);

        const qtySpan = document.querySelector(`.js-qty[data-itemid="${cssEscape(itemId)}"]`);
        const current = Number(qtySpan?.textContent || '0');

        try {
            if (plusBtn) {
                const next = current + 1;
                if (qtySpan) qtySpan.textContent = String(next);
                toggleMinusIcon(itemId, next);
                updateSummaryFromDom();

                await updateQty(itemId, next);
                showToast('수량이 변경되었습니다.');
                return;
            }

            if (current <= 1) {
                await deleteItem(itemId);
                removeCartRowFromDom(itemId);
                updateSummaryFromDom();

                const totalQty = Number(document.getElementById('total-qty')?.textContent || '0');
                if (totalQty <= 0) showEmptyCartUI();
                else showNonEmptyCartUI();

                showToast('아이템이 삭제되었습니다.');
                return;
            }

            const next = current - 1;
            if (qtySpan) qtySpan.textContent = String(next);
            toggleMinusIcon(itemId, next);
            updateSummaryFromDom();

            await updateQty(itemId, next);
            showToast('수량이 변경되었습니다.');
        } catch (err) {
            showToast(err?.message || '처리 중 오류가 발생했습니다.');
        } finally {
            pending.delete(itemId);
        }
    };

    window.addEventListener('load', () => {
        connectNavTopic();
        connectCartTopic();
    });

    document.addEventListener('click', handleQtyClick);

    window.addEventListener('beforeunload', () => {
        disconnectQuietly(navStomp);
        disconnectQuietly(cartStomp);
    });
</script>
</body>
</html>
