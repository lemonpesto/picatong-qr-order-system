<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>장바구니</title>

    <link rel="stylesheet" href="/css/main.css" />
    <script src="https://kit.fontawesome.com/a3ff865f92.js" crossorigin="anonymous"></script>
</head>

<body>
<!-- nav include -->
<div th:replace="~{fragments/nav :: nav(${navTitle}, ${navBack}, ${tableNum})}"></div>

<!-- 빈 장바구니 -->
<div id="empty-cart" class="cart-section"
     th:classappend="${#lists.isEmpty(cartItems)} ? '' : 'hidden'">
    <div class="inline-action">
        <p class="cart-notice">장바구니가 비었습니다.</p>
        <a th:href="@{/items}" id="menu-btn" class="outline-button inline-button">메뉴 보기</a>
    </div>
</div>

<!-- 에러 메시지 표시 -->
<div th:if="${error}" class="error-message" style="
    background: #fee;
    color: #c33;
    padding: 12px 16px;
    margin: 16px;
    border-radius: 4px;
    border-left: 4px solid #c33;">
    <i class="fas fa-exclamation-circle"></i>
    <span th:text="${error}">에러 메시지</span>
</div>

<!-- 장바구니 리스트 -->
<div id="non-empty-cart" class="cart-section"
     th:classappend="${#lists.isEmpty(cartItems)} ? 'hidden' : ''">
    <h3 class="total-qty">
        선택한 메뉴
        <span id="total-qty" th:text="${summary.totalQuantity}">0</span>개
    </h3>

    <div th:each="ci, stat : ${cartItems}">
        <div
            class="cart-items list-box"
            th:attr="
                data-itemid=${ci.item.id},
                data-name=${ci.item.name},
                data-price=${ci.item.price}
            "
        >
            <div class="menu-info">
                <h4 th:text="${ci.item.name}">메뉴명</h4>
                <p class="price">
                    <span th:text="${#numbers.formatInteger(ci.item.price, 0, 'COMMA')}">0</span>원
                </p>

                <!-- description 있으면 표시 -->
                <span
                    th:if="${ci.item.description != null and !#strings.isEmpty(ci.item.description)}"
                    class="subtext comment"
                    th:text="${ci.item.description}"
                >설명</span>
            </div>

            <div class="cart-item qty-control">
                <button type="button" class="qty-btn minus" th:attr="data-itemid=${ci.item.id}">
                    <!-- qty == 1 일 때: 휴지통 -->
                    <i class="fa-regular fa-trash-can fa-2xs"
                       th:classappend="${ci.quantity > 1} ? 'hidden' : ''"></i>

                    <!-- qty >= 2 일 때: 마이너스 -->
                    <i class="fa-solid fa-minus fa-2xs"
                       th:classappend="${ci.quantity <= 1} ? 'hidden' : ''"></i>
                </button>
                <span class="qty" th:attr="data-itemid=${ci.item.id}" th:text="${ci.quantity}">1</span>

                <button type="button" class="qty-btn plus" th:attr="data-itemid=${ci.item.id}">
                    <i class="fa-solid fa-plus fa-2xs"></i>
                </button>
            </div>
        </div>

        <!-- divider -->
        <div th:unless="${stat.last}" class="menu-divider"></div>
    </div>
</div>

<div id="section-divider" class="section-divider"
     th:if="${!#lists.isEmpty(cartItems)}"></div>
<div id="toast" class="toast"></div>

<!-- 주문하기 버튼 -->
<div id="bottom-bar" th:if="${!#lists.isEmpty(cartItems)}" class="bottom-bar">
    <a th:href="@{/orders/create}" id="order" class="bottom-button">
        총 <span id="total-amount"
                th:text="${#numbers.formatInteger(summary.totalAmount, 0, 'COMMA')}">0</span>원
        주문하기
    </a>
</div>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>


<script th:src="@{/js/toast.js}"></script>
<script th:inline="javascript">

    // ==== State / Config ====
    const tableId = /*[[${tableId}]]*/ null;

    const WS = {
        url: '/ws',
        topics: {
            nav:  (tableId) => `/topic/tables/${tableId}/nav`,
            cart: (tableId) => `/topic/tables/${tableId}/cart`,
        },
    };

    let navStomp = null;
    let cartStomp = null;

    // 연타 방지용 (itemId 문자열)
    const pending = new Set();

    // 중복 reload 방지
    let reloading = false;

    // ==== Utils ====
    const safeJson = (str) => {
        try { return JSON.parse(str); } catch { return null; }
    };

    const setText = (id, value) => {
        const el = document.getElementById(id);
        if (el) el.textContent = value;
    };

    const formatComma = (n) => Number(n ?? 0).toLocaleString('ko-KR');

    // selector escape (간단 버전)
    const cssEscape = (v) => String(v).replaceAll('"', '\\"');

    const hasTable = () => !!tableId;

    const disconnectQuietly = (client) => {
        try { client?.disconnect(); } catch (e) {}
    };

    const scheduleReload = () => {
        if (reloading) return;
        reloading = true;
        window.location.reload();
    };

    // ==== WebSocket ====
    const createStompClient = () => {
        const socket = new SockJS(WS.url);
        const client = Stomp.over(socket);
        client.debug = null;
        return client;
    };

    const connectNavTopic = () => {
        if (!hasTable()) return;

        navStomp = createStompClient();
        navStomp.connect({}, () => {
            navStomp.subscribe(WS.topics.nav(tableId), onNavMessage);
        });
    };

    const onNavMessage = (frame) => {
        const evt = safeJson(frame.body);
        if (!evt) return;

        if (evt.type === 'REDIRECT' && evt.data?.url) {
            window.location.replace(evt.data.url);
            return;
        }

        if (evt.type === 'INFO' && evt.data?.message) {
            showToast(evt.data.message);
        }
    };

    const connectCartTopic = () => {
        if (!hasTable()) return;

        cartStomp = createStompClient();
        cartStomp.connect({}, () => {
            cartStomp.subscribe(WS.topics.cart(tableId), onCartMessage);
        });
    };

    const onCartMessage = (frame) => {
        const evt = safeJson(frame.body);
        if (!evt || evt.type !== 'CART_UPDATED') return;

        // evt.data = { summary, items }
        applyCartSync(evt.data);

        // WS가 최종 반영(낙관적 UI 종료)
        pending.clear();
    };

    // ==== UI ====
    function showEmptyCartUI() {
        const empty = document.getElementById('empty-cart');
        const nonEmpty = document.getElementById('non-empty-cart');

        if (empty) empty.classList.remove('hidden');
        if (nonEmpty) nonEmpty.classList.add('hidden');

        removeBottomBar();
    }

    function showNonEmptyCartUI() {
        const empty = document.getElementById('empty-cart');
        const nonEmpty = document.getElementById('non-empty-cart');

        if (empty) empty.classList.add('hidden');
        if (nonEmpty) nonEmpty.classList.remove('hidden');
    }

    const removeBottomBar = () => {
        const bottomBar = document.getElementById('bottom-bar');
        const divider = document.getElementById('section-divider')
        if (bottomBar) bottomBar.remove();
        if (divider) divider.remove();
    };

    const toggleMinusIcon = (itemId, qty) => {
        const row = document.querySelector(`.cart-items.list-box[data-itemid="${cssEscape(itemId)}"]`);
        if (!row) return;

        const trash = row.querySelector('.fa-trash-can');
        const minus = row.querySelector('.fa-minus');

        if (!trash || !minus) return;

        if (qty <= 1) {
            trash.classList.remove('hidden');
            minus.classList.add('hidden');
        } else {
            trash.classList.add('hidden');
            minus.classList.remove('hidden');
        }
    };

    const updateSummaryFromDom = () => {
        const rows = document.querySelectorAll('.cart-items.list-box[data-itemid]');
        let totalQty = 0;
        let totalAmount = 0;

        rows.forEach((row) => {
            const price = Number(row.getAttribute('data-price') || '0');
            const qtyEl = row.querySelector('.qty');
            const qty = Number(qtyEl?.textContent || '0');

            totalQty += qty;
            totalAmount += price * qty;
        });

        setText('total-qty', String(totalQty));
        setText('total-amount', formatComma(totalAmount));
    };

    const removeCartRowFromDom = (itemId) => {
        const row = document.querySelector(`.cart-items.list-box[data-itemid="${cssEscape(itemId)}"]`);
        if (!row) return;

        // row 다음에 divider가 있으면 같이 제거 (마지막이 아니었던 경우)
        const next = row.nextElementSibling;
        if (next && next.classList.contains('menu-divider')) {
            next.remove();
        } else {
            // 마지막 row를 지운 경우, 이전 divider(바로 앞) 제거
            const prev = row.previousElementSibling;
            if (prev && prev.classList.contains('menu-divider')) {
                prev.remove();
            }
        }

        row.remove();
    };



    // ==== API ====
    const updateQty = async (itemId, qty) => {
        const res = await fetch(`/cart/update?itemId=${encodeURIComponent(itemId)}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ qty }),
        });
        if (!res.ok) throw new Error(await res.text());
    };

    const deleteItem = async (itemId) => {
        const res = await fetch(`/cart/delete?itemId=${encodeURIComponent(itemId)}`, {
            method: 'DELETE',
        });
        if (!res.ok) throw new Error(await res.text());
    };

    /* =========================================================
     *  Cart sync (WS payload -> DOM patch)
     *   - 수량 변경: 부분 갱신
     *   - 새 아이템 추가 / 삭제: reload
     * ========================================================= */
    const applyCartSync = (sync) => {
        const summary = sync?.summary || { totalQuantity: 0, totalAmount: 0 };
        const items = Array.isArray(sync?.items) ? sync.items : [];

        // 1) 요약 갱신
        setText('total-qty', String(summary.totalQuantity ?? 0));
        setText('total-amount', formatComma(summary.totalAmount ?? 0));

        // 2) empty/non-empty 토글
        const totalQty = summary.totalQuantity ?? 0;
        if (totalQty <= 0 || items.length === 0) {
            showEmptyCartUI();
            return;
        }
        showNonEmptyCartUI();

        // 3) 추가/삭제 감지 -> reload
        const domIds = new Set(
            Array.from(document.querySelectorAll('.cart-items.list-box[data-itemid]'))
                .map((el) => String(el.getAttribute('data-itemid')))
        );
        const incomingIds = new Set(items.map((line) => String(line.itemId)));

        if (domIds.size !== incomingIds.size) {
            scheduleReload();
            return;
        }
        for (const id of incomingIds) {
            if (!domIds.has(id)) {
                scheduleReload();
                return;
            }
        }

        // 4) 수량만 부분 갱신
        const incomingMap = new Map(items.map((line) => [String(line.itemId), line]));
        document.querySelectorAll('.cart-items.list-box[data-itemid]').forEach((row) => {
            const id = String(row.getAttribute('data-itemid'));
            const line = incomingMap.get(id);
            if (!line) return; // (여기 오면 사실상 reload 대상인데 위에서 걸러짐)

            const qtySpan = row.querySelector(`.qty[data-itemid="${cssEscape(id)}"]`);
            if (qtySpan) qtySpan.textContent = String(line.quantity);
            toggleMinusIcon(id, Number(line.quantity));
        });
    };

    // ==== Click handler (+/-) ====
    const handleQtyClick = async (e) => {
        const plusBtn  = e.target.closest('.qty-btn.plus');
        const minusBtn = e.target.closest('.qty-btn.minus');
        if (!plusBtn && !minusBtn) return;

        const btn = plusBtn || minusBtn;
        const itemId = btn.getAttribute('data-itemid');
        if (!itemId) return;

        // 연타 방지
        if (pending.has(itemId)) return;
        pending.add(itemId);

        const qtySpan = document.querySelector(`.qty[data-itemid="${cssEscape(itemId)}"]`);
        const current = Number(qtySpan?.textContent || '0');

        try {
            if (plusBtn) {
                const next = current + 1;

                if (qtySpan) qtySpan.textContent = String(next);
                toggleMinusIcon(itemId, next);
                updateSummaryFromDom();

                await updateQty(itemId, next);
                showToast('수량이 변경되었습니다.');
                return;
            }

            // minus
            if (current <= 1) {
                // 삭제
                await deleteItem(itemId);

                removeCartRowFromDom(itemId);   // DOM 해당 아이템 줄 제거
                updateSummaryFromDom();         // 장바구니 요약 정보 갱신

                // 마지막 장바구니 아이템이었다면 빈 장바구니 UI
                const totalQty = Number(document.getElementById('total-qty')?.textContent || '0');
                if (totalQty <= 0) {
                    showEmptyCartUI();
                } else {
                    showNonEmptyCartUI();
                }

                showToast('아이템이 삭제되었습니다.');
                return;
            }

            const next = current - 1;

            // 낙관적 UI
            if (qtySpan) qtySpan.textContent = String(next);
            toggleMinusIcon(itemId, next);
            updateSummaryFromDom();

            await updateQty(itemId, next);
            showToast('수량이 변경되었습니다.');
        } catch (err) {
            showToast(err?.message || '처리 중 오류가 발생했습니다.');
        } finally {
            pending.delete(itemId);
        }
    };

    // ==== Entry / Bindings ====
    window.addEventListener('load', () => {
        connectNavTopic();
        connectCartTopic();
    });

    document.addEventListener('click', handleQtyClick);

    window.addEventListener('beforeunload', () => {
        disconnectQuietly(navStomp);
        disconnectQuietly(cartStomp);
    });
</script>


</body>
</html>
