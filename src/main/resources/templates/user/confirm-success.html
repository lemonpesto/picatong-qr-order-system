<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>결제확인</title>

    <link rel="stylesheet" href="/css/user-unified.css" />
</head>

<body class="user">
<div th:replace="~{fragments/nav :: nav(${navTitle}, null, ${tableNum}, false)}"></div>
<div th:replace="~{fragments/toast :: toast}"></div>

<div class="user-container">
    <div class="user-inline">
        <p class="user-inline__text">주문이 접수되었습니다!</p>
        <a th:href="@{/items}" class="u-btn u-btn--outline user-inline__btn" style="max-width: 220px;">추가 주문하기</a>
    </div>
</div>
</body>
</html>
