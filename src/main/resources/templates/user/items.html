<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>메뉴판</title>

    <link rel="stylesheet" href="/css/main.css" />
    <script src="https://kit.fontawesome.com/a3ff865f92.js" crossorigin="anonymous"></script>
</head>

<body>
<!-- nav -->
<div th:replace="~{fragments/nav :: nav(null, null, ${tableNum})}"></div>

<!-- 카테고리 목차 -->
<div class="category-bar" th:if="${!#lists.isEmpty(categories)}">
    <button
            class="category-button"
            th:each="cat : ${categories}"
            th:attr="data-target=${'section-' + cat.id}"
            th:text="${cat.name}"
    >
        카테고리
    </button>
</div>

<div class="callout-container">
    <div class="menu-callout">
        <i class="fa-solid fa-bullhorn callout-icon"></i>
        <span class="callout-text">최초 주문 시 안주를 포함하여 만 원 이상 주문 필수입니다!</span>
    </div>
    <div class="menu-callout">
        <i class="fa-solid fa-bullhorn callout-icon"></i>
        <span class="callout-text">주방은 23시에, 칵테일은 23시 30분에 마감됩니다.</span>
    </div>
</div>

<!-- 메뉴 리스트 -->
<div th:if="${#lists.isEmpty(categories)}" class="list-box">
    <p>카테고리가 없습니다.</p>
</div>

<div th:each="cat, cstat : ${categories}">
    <div th:attr="id=${'section-' + cat.id}" class="menu-section">
        <h3 th:text="${cat.name}">카테고리명</h3>

        <!-- 카테고리에 속한 아이템들만 출력 -->
        <div th:each="it, istat : ${items}" th:if="${it.category != null and it.category.id == cat.id}">
            <div
                    class="list-box menu-box"
                    th:classappend="${it.isActive} ? '' : ' sold-out'"
                    th:attr="
                      data-itemid=${it.id},
                      data-name=${it.name},
                      data-price=${it.price}
                    "
            >
                <h4 th:text="${it.isActive} ? ${it.name} : ${'(품절) ' + it.name}">
                    메뉴명
                </h4>

                <p class="price">
                    <span th:text="${#numbers.formatInteger(it.price, 0, 'COMMA')}">0</span>원
                </p>

                <p class="description" th:text="${it.description != null ? it.description : ''}">
                    설명
                </p>
            </div>

            <div class="menu-divider" th:if="${!istat.last}"></div>
        </div>
    </div>

    <div class="section-divider" th:if="${!cstat.last}"></div>
</div>

<!-- 장바구니 보기 버튼 -->
<div class="bottom-bar">
    <a href="/cart" id="view-cart" class="bottom-button hidden">장바구니 보기</a>
</div>

<!-- 바텀 시트 -->
<div id="bottom-sheet" class="bottom-sheet hidden">
    <div class="bottom-sheet-content">
        <div class="sheet-header">
            <h4 id="sheet-name">메뉴명</h4>
            <button id="close-sheet">✕</button>
        </div>

        <div class="sheet-subheader">
            <span id="sheet-price">단가</span>
        </div>

        <div class="sheet-body">
            <div class="qty-row">
                <span class="qty-label">수량</span>
                <div class="qty-control">
                    <button id="minus" class="qty-btn" disabled>
                        <i class="fa-solid fa-minus fa-2xs"></i>
                    </button>
                    <span id="qty" class="qty">1</span>
                    <button id="plus" class="qty-btn">
                        <i class="fa-solid fa-plus fa-2xs"></i>
                    </button>
                </div>
            </div>

            <div id="comment-row" class="comment-row" style="display:none">
                <label for="sheet-comment">요청사항</label>
                <input id="sheet-comment" type="text" placeholder="예: 덜 달게, 상큼하게 등" maxlength="50" />
            </div>
        </div>

        <button id="add-to-cart" class="cart-button">0원 장바구니에 담기</button>
    </div>
</div>

<div id="toast" class="toast"></div>
<div id="overlay" class="overlay hidden"></div>

<!-- WebSocket libs -->
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

<script th:inline="javascript">
    // ============================================
    // Vars
    // ============================================
    const tableId = /*[[${tableId}]]*/ null;

    let currItemId = null;
    let currPrice = 0;
    let qty = 1;

    // WS clients (nav / cart)
    let navStomp = null;
    let cartStomp = null;
    let itemUpdateStomp = null;

    // ============================================
    // Init
    // ============================================
    document.addEventListener("DOMContentLoaded", () => {
        bindCategoryScroll();
        bindBottomSheet();

        // 초기 1회: 현재 summary로 버튼 표시
        refreshCartSummaryFromServer();

        // WS 연결
        connectNavTopic();
        connectCartTopic();
        connectItemUpdateTopic();
    });

    window.addEventListener("beforeunload", () => {
        try { navStomp?.disconnect(); } catch (e) {}
        try { cartStomp?.disconnect(); } catch (e) {}
        try { itemUpdateStomp?.disconnect(); } catch (e) {}
    });

    // bottom-bar sticky/fixed
    window.addEventListener("resize", () => {
        const bar = document.querySelector(".bottom-bar");
        if (!bar) return;
        bar.style.position = document.body.scrollHeight > window.innerHeight ? "sticky" : "fixed";
    });

    // ============================================
    // WebSocket: NAV (/topic/tables/{tableId}/nav)
    // ============================================
    function connectNavTopic() {
        if (!tableId) return;

        const socket = new SockJS("/ws");
        navStomp = Stomp.over(socket);
        navStomp.debug = null;

        navStomp.connect({}, () => {
            navStomp.subscribe(`/topic/tables/${tableId}/nav`, (frame) => {
                const evt = safeJson(frame.body);
                if (!evt) return;

                if (evt.type === "REDIRECT" && evt.data?.url) {
                    window.location.replace(evt.data.url);
                    return;
                }
                if (evt.type === "INFO" && evt.data?.message) {
                    showToast(evt.data.message);
                }
            });
        });
    }

    // ============================================
    // WebSocket: CART (/topic/tables/{tableId}/cart)
    // - 부분 갱신: "장바구니 보기 버튼 요약"만 업데이트
    // ============================================
    function connectCartTopic() {
        if (!tableId) return;

        const socket = new SockJS("/ws");
        cartStomp = Stomp.over(socket);
        cartStomp.debug = null;

        cartStomp.connect({}, () => {
            cartStomp.subscribe(`/topic/tables/${tableId}/cart`, (frame) => {
                const evt = safeJson(frame.body);
                if (!evt || evt.type !== "CART_UPDATED") return;

                // evt.data = { summary, items }
                const summary = evt.data?.summary;
                if (summary) {
                    renderCartButton(summary);
                } else {
                    // 혹시 포맷이 바뀌면 안전하게 재조회
                    refreshCartSummaryFromServer();
                }
            });
        });
    }

    // ==== 관리자가 메뉴 수정 시 ====
    function connectItemUpdateTopic() {
        const socket = new SockJS("/ws");
        itemUpdateStomp = Stomp.over(socket);
        itemUpdateStomp.debug = null;

        itemUpdateStomp.connect({}, () => {
            itemUpdateStomp.subscribe("/topic/items/updated", (frame) => {
                const evt = safeJson(frame.body);
                if (!evt || evt.type !== "ITEM_UPDATED") return;

                const it = evt.data; // { itemId, name, price, isActive }
                applyItemUpdateToItemsPage(it);
                showToast("메뉴 정보가 업데이트되었습니다.");
            });
        });
    }

    function applyItemUpdateToItemsPage(it) {
        // menu-box는 data-itemid로 식별 가능
        const box = document.querySelector(`.menu-box[data-itemid="${String(it.itemId)}"]`);
        if (!box) return; // 현재 화면에 없는 아이템이면 무시

        // 품절 표시/클릭 막기
        if (!it.isActive) box.classList.add("sold-out");
        else box.classList.remove("sold-out");

        // 제목(품절 prefix 포함)
        const h4 = box.querySelector("h4");
        if (h4) {
            h4.textContent = it.isActive ? it.name : `(품절) ${it.name}`;
        }

        // 가격
        const priceSpan = box.querySelector(".price span");
        if (priceSpan) priceSpan.textContent = Number(it.price).toLocaleString("ko-KR");

        // dataset도 갱신(바텀시트에서 사용)
        box.dataset.name = it.name;
        box.dataset.price = String(it.price);
    }

    // ============================================
    // UI: Category scroll
    // ============================================
    function bindCategoryScroll() {
        document.querySelectorAll(".category-button").forEach((btn) => {
            btn.addEventListener("click", () => {
                const id = btn.dataset.target;
                const section = document.getElementById(id);
                if (section) section.scrollIntoView({ behavior: "smooth", block: "start" });
            });
        });
    }

    // ============================================
    // UI: Bottom sheet
    // ============================================
    function bindBottomSheet() {
        // 아이템 클릭 시 open
        document.querySelectorAll(".menu-box").forEach((box) => {
            box.addEventListener("click", () => openBottomSheet(box));
        });

        // 닫기
        document.getElementById("close-sheet").addEventListener("click", closeBottomSheet);
        document.getElementById("overlay").addEventListener("click", closeBottomSheet);

        // 수량 +
        document.getElementById("plus").addEventListener("click", () => {
            qty++;
            updateQtyUI();
        });

        // 수량 -
        document.getElementById("minus").addEventListener("click", () => {
            if (qty <= 1) return;
            qty--;
            updateQtyUI();
        });

        // 장바구니 담기
        document.getElementById("add-to-cart").addEventListener("click", onAddToCart);
    }

    function openBottomSheet(box) {
        if (box.classList.contains("sold-out")) return;

        currItemId = Number(box.dataset.itemid);
        currPrice = Number(box.dataset.price);
        qty = 1;

        document.getElementById("sheet-name").textContent = box.dataset.name;
        document.getElementById("sheet-price").textContent = formatWon(currPrice);
        document.getElementById("comment-row").style.display = "none";

        updateQtyUI();

        document.getElementById("bottom-sheet").classList.remove("hidden");
        document.getElementById("overlay").classList.remove("hidden");
    }

    function closeBottomSheet() {
        document.getElementById("bottom-sheet").classList.add("hidden");
        document.getElementById("overlay").classList.add("hidden");
    }

    function updateQtyUI() {
        document.getElementById("qty").textContent = String(qty);
        document.getElementById("minus").disabled = qty === 1;
        updateAddToCartButtonText();
    }

    function updateAddToCartButtonText() {
        document.getElementById("add-to-cart").textContent =
            `${formatComma(currPrice * qty)}원 장바구니에 담기`;
    }

    async function onAddToCart() {
        if (!currItemId) return;

        try {
            const res = await fetch("/cart/add", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ itemId: currItemId, quantity: qty }),
            });

            if (!res.ok) {
                const errMsg = await res.text().catch(() => "");
                throw new Error(errMsg || "장바구니 담기 실패");
            }

            // 서버가 summary를 반환하는 경우에만 즉시 반영(선택)
            // 최종 동기화는 WS 이벤트가 담당
            const maybeJson = await res.text();
            if (maybeJson) {
                const parsed = safeJson(maybeJson);
                if (parsed && (parsed.totalAmount != null || parsed.totalQuantity != null)) {
                    renderCartButton(parsed);
                }
            }

            showToast("장바구니에 추가되었습니다.");
        } catch (err) {
            showToast(err?.message || "문제가 발생했어요 😢");
        } finally {
            closeBottomSheet();
        }
    }

    // ============================================
    // Cart button
    // ============================================
    function renderCartButton(summary) {
        const viewCart = document.getElementById("view-cart");
        const totalQuantity = Number(summary?.totalQuantity ?? 0);
        const totalAmount = Number(summary?.totalAmount ?? 0);

        if (totalQuantity > 0) {
            viewCart.textContent = `총 ${formatComma(totalAmount)}원 장바구니 보기 (${totalQuantity})`;
            viewCart.classList.remove("hidden");
        } else {
            viewCart.classList.add("hidden");
        }
    }

    async function refreshCartSummaryFromServer() {
        try {
            const res = await fetch("/cart/summary");
            if (!res.ok) return;
            const data = await res.json(); // { totalAmount, totalQuantity }
            renderCartButton(data);
        } catch (e) {
            console.error(e);
        }
    }

    // ============================================
    // Utils
    // ============================================
    function safeJson(str) {
        try { return JSON.parse(str); } catch (e) { return null; }
    }

    function formatComma(n) {
        return Number(n ?? 0).toLocaleString("ko-KR");
    }

    function formatWon(n) {
        return `${formatComma(n)}원`;
    }
</script>
</body>
</html>
