<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>메뉴판</title>

    <link rel="stylesheet" href="/css/user-unified.css"/>
    <script src="https://kit.fontawesome.com/a3ff865f92.js" crossorigin="anonymous"></script>
</head>

<body class="user">
<!-- nav -->
<div th:replace="~{fragments/nav :: nav(null, null, ${tableNum}, true)}"></div>
<div th:replace="~{fragments/toast :: toast}"></div>

<!-- 카테고리 목차 -->
<div class="user-tabs" th:if="${!#lists.isEmpty(categories)}">
    <button
            class="user-tabs__btn js-category-btn"
            th:each="cat : ${categories}"
            th:attr="data-target=${'section-' + cat.id}"
            th:text="${cat.name}"
    >
        카테고리
    </button>
</div>

<div class="user-callouts">
    <div class="user-callout">
        <i class="fa-solid fa-bullhorn user-callout__icon"></i>
        <span class="user-callout__text">테이블당 메인 메뉴 1개 이상 주문 필수입니다!</span>
    </div>
</div>

<!-- 메뉴 리스트 -->
<div th:if="${#lists.isEmpty(categories)}" class="user-container">
    <p class="u-muted">카테고리가 없습니다.</p>
</div>

<div th:each="cat, cstat : ${categories}">
    <section th:attr="id=${'section-' + cat.id}" class="user-menu__section">
        <h3 class="user-menu__title" th:text="${cat.name}">카테고리명</h3>

        <!-- 카테고리에 속한 아이템들만 출력 -->
        <div th:each="it, istat : ${items}"
             th:if="${it.category != null and it.category.id == cat.id}">
            <div
                    class="user-menu__card js-menu-card"
                    th:classappend="${it.isActive} ? '' : ' user-menu__card--soldout'"
                    th:attr="data-itemid=${it.id}, data-name=${it.name}, data-price=${it.price}"
            >
                <h4 class="user-menu__name"
                    th:text="${it.isActive} ? ${it.name} : ${'(품절) ' + it.name}">
                    메뉴명
                </h4>

                <p class="user-menu__price">
                    <span th:text="${#numbers.formatInteger(it.price, 0, 'COMMA')}">0</span>원
                </p>

                <p class="user-menu__desc" th:text="${it.description != null ? it.description : ''}">설명</p>
            </div>

            <span class="u-divider u-divider--hair" th:if="${!istat.last}"></span>
        </div>
    </section>

    <span class="u-divider" th:if="${!cstat.last}"></span>
</div>

<!-- 장바구니 보기 버튼 -->
<div id="cart-bottombar" class="user-bottombar" th:classappend="${isOrdering} ? ' u-hidden' : ''">
    <a href="/cart" id="view-cart" class="u-btn u-btn--primary user-bottombar__btn u-hidden">장바구니 보기</a>
</div>

<!-- 바텀 시트 -->
<div id="bottom-sheet" class="user-sheet u-hidden">
    <div class="user-sheet__content">
        <div class="user-sheet__header">
            <h4 id="sheet-name" class="user-sheet__title">메뉴명</h4>
            <button id="close-sheet" class="user-sheet__close" aria-label="close">✕</button>
        </div>

        <div class="user-sheet__sub">
            <span id="sheet-price">단가</span>
        </div>

        <div class="user-sheet__body">
            <div class="user-sheet__row">
                <span class="user-sheet__label">수량</span>
                <div class="user-qty">
                    <button id="minus" class="user-qty__btn" disabled>
                        <i class="fa-solid fa-minus"></i>
                    </button>
                    <span id="qty" class="user-qty__value">1</span>
                    <button id="plus" class="user-qty__btn">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                </div>
            </div>

            <div id="comment-row" class="user-sheet__comment" style="display:none">
                <label for="sheet-comment" class="user-sheet__label">요청사항</label>
                <input id="sheet-comment" type="text" placeholder="예: 덜 달게, 상큼하게 등" maxlength="50"/>
            </div>
        </div>

        <button id="add-to-cart" class="u-btn u-btn--primary">0원 장바구니에 담기</button>
    </div>
</div>

<div id="overlay" class="user-overlay u-hidden"></div>
<script th:src="@{/js/toast.js}"></script>
<script th:src="@{/js/api.js}"></script>


<!-- WebSocket libs -->
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>


<script th:inline="javascript">
    const tableId = /*[[${tableId}]]*/ null;
    let cartOrdering = /*[[${isOrdering}]]*/ false;
    const sessionId = /*[[${sessionId}]]*/ null;

    let currItemId = null;
    let currPrice = 0;
    let qty = 1;

    let navStomp = null;
    let cartStomp = null;
    let itemUpdateStomp = null;

    document.addEventListener("DOMContentLoaded", () => {
        bindCategoryScroll();
        bindBottomSheet();

        toggleCartBar(cartOrdering);
        refreshCartSummaryFromServer();

        connectNavTopic();
        connectCartTopic();
        connectItemUpdateTopic();

        const pendingToast = sessionStorage.getItem('pending-toast');
        if (pendingToast) {
            sessionStorage.removeItem('pending-toast');
            showToast(pendingToast);
        }
    });

    window.addEventListener("beforeunload", () => {
        try {
            navStomp?.disconnect();
        } catch (e) {
        }
        try {
            cartStomp?.disconnect();
        } catch (e) {
        }
        try {
            itemUpdateStomp?.disconnect();
        } catch (e) {
        }
    });

    function connectNavTopic() {
        if (!tableId) return;

        const socket = new SockJS("/ws");
        navStomp = Stomp.over(socket);
        navStomp.debug = null;

        navStomp.connect({}, () => {
            navStomp.subscribe(`/topic/tables/${tableId}/nav`, (frame) => {
                const evt = ApiUtils.safeJson(frame.body);
                if (!evt) return;

                if (evt.type === "REDIRECT" && evt.data?.url) {
                    if (evt.data?.sourceSessionId && sessionId && evt.data.sourceSessionId === sessionId) {
                        return;
                    }
                    if (evt.data?.message) {
                        sessionStorage.setItem('pending-toast', evt.data.message);
                    }
                    window.location.replace(evt.data.url);
                    return;
                }
                if (evt.type === "INFO" && evt.data?.message) {
                    showToast(evt.data.message);
                }
            });
        });
    }

    function connectCartTopic() {
        if (!tableId) return;

        const socket = new SockJS("/ws");
        cartStomp = Stomp.over(socket);
        cartStomp.debug = null;

        cartStomp.connect({}, () => {
            cartStomp.subscribe(`/topic/tables/${tableId}/cart`, (frame) => {
                const evt = ApiUtils.safeJson(frame.body);
                if (!evt || evt.type !== "CART_UPDATED") return;

                const summary = evt.data?.summary;
                if (evt.data?.ordering != null) {
                    cartOrdering = evt.data.ordering;
                    toggleCartBar(cartOrdering);
                }
                if (summary) renderCartButton(summary);
                else refreshCartSummaryFromServer();
            });
        });
    }

    function connectItemUpdateTopic() {
        const socket = new SockJS("/ws");
        itemUpdateStomp = Stomp.over(socket);
        itemUpdateStomp.debug = null;

        itemUpdateStomp.connect({}, () => {
            itemUpdateStomp.subscribe("/topic/items/updated", (frame) => {
                const evt = ApiUtils.safeJson(frame.body);
                if (!evt || evt.type !== "ITEM_UPDATED") return;

                const it = evt.data;
                applyItemUpdateToItemsPage(it);
                showToast("메뉴 정보가 업데이트되었습니다.");
            });
        });
    }

    function applyItemUpdateToItemsPage(it) {
        const box = document.querySelector(`.js-menu-card[data-itemid="${String(it.itemId)}"]`);
        if (!box) return;

        if (!it.isActive) box.classList.add("user-menu__card--soldout");
        else box.classList.remove("user-menu__card--soldout");

        const h4 = box.querySelector(".user-menu__name");
        if (h4) h4.textContent = it.isActive ? it.name : `(품절) ${it.name}`;

        const priceSpan = box.querySelector(".user-menu__price span");
        if (priceSpan) priceSpan.textContent = Number(it.price).toLocaleString("ko-KR");

        const desc = box.querySelector(".user-menu__desc");
        if (desc) desc.textContent = it.description ?? "";

        box.dataset.name = it.name;
        box.dataset.price = String(it.price);
    }

    function bindCategoryScroll() {
        const tabsEl = document.querySelector(".user-tabs");

        document.querySelectorAll(".js-category-btn").forEach((btn) => {
            btn.addEventListener("click", () => {
                document.querySelectorAll(".js-category-btn")
                    .forEach(b => b.classList.remove("user-tabs__btn--active"));
                btn.classList.add("user-tabs__btn--active");

                const id = btn.dataset.target;
                const section = document.getElementById(id);
                if (!section) return;

                // tabs가 sticky/fixed라면 클릭 시점의 bottom 값이 스크롤 후에도 동일하므로 정확하게 맞음.
                const tabsBottom = tabsEl ? tabsEl.getBoundingClientRect().bottom : 0;
                const sectionTopOnPage = section.getBoundingClientRect().top + window.scrollY;
                const targetY = sectionTopOnPage - tabsBottom;

                window.scrollTo({
                    top: Math.max(0, targetY),
                    behavior: "smooth",
                });
            });
        });
    }

    function bindBottomSheet() {
        document.querySelectorAll(".js-menu-card").forEach((box) => {
            box.addEventListener("click", () => openBottomSheet(box));
        });

        document.getElementById("close-sheet").addEventListener("click", closeBottomSheet);
        document.getElementById("overlay").addEventListener("click", closeBottomSheet);

        document.getElementById("plus").addEventListener("click", () => {
            qty++;
            updateQtyUI();
        });
        document.getElementById("minus").addEventListener("click", () => {
            if (qty <= 1) return;
            qty--;
            updateQtyUI();
        });

        document.getElementById("add-to-cart").addEventListener("click", onAddToCart);
    }

    function openBottomSheet(box) {
        if (box.classList.contains("user-menu__card--soldout")) return;

        currItemId = Number(box.dataset.itemid);
        currPrice = Number(box.dataset.price);
        qty = 1;

        document.getElementById("sheet-name").textContent = box.dataset.name;
        document.getElementById("sheet-price").textContent = formatWon(currPrice);
        document.getElementById("comment-row").style.display = "none";

        updateQtyUI();

        document.getElementById("bottom-sheet").classList.remove("u-hidden");
        document.getElementById("overlay").classList.remove("u-hidden");
    }

    function closeBottomSheet() {
        document.getElementById("bottom-sheet").classList.add("u-hidden");
        document.getElementById("overlay").classList.add("u-hidden");
    }

    function updateQtyUI() {
        document.getElementById("qty").textContent = String(qty);
        document.getElementById("minus").disabled = qty === 1;
        updateAddToCartButtonText();
    }

    function updateAddToCartButtonText() {
        document.getElementById("add-to-cart").textContent =
            `${formatComma(currPrice * qty)}원 장바구니에 담기`;
    }

    async function onAddToCart() {
        if (!currItemId) return;

        try {
            const res = await fetch("api/cart/items", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({itemId: currItemId, quantity: qty}),
            });

            if (!res.ok) {
                const errMsg = await ApiUtils.readErrorMessage(res);
                throw new Error(errMsg || "장바구니 담기 실패");
            }

            const maybeJson = await res.text();
            if (maybeJson) {
                const parsed = ApiUtils.safeJson(maybeJson);
                if (parsed && (parsed.totalAmount != null || parsed.totalQuantity != null)) {
                    renderCartButton(parsed);
                }
            }

            showToast("장바구니에 추가되었습니다.");
        } catch (err) {
            showToast(err?.message || "문제가 발생했어요 😢");
        } finally {
            closeBottomSheet();
        }
    }

    function renderCartButton(summary) {
        const viewCart = document.getElementById("view-cart");
        if (!viewCart) return;
        const totalQuantity = Number(summary?.totalQuantity ?? 0);
        const totalAmount = Number(summary?.totalAmount ?? 0);

        if (!cartOrdering && totalQuantity > 0) {
            viewCart.textContent = `총 ${formatComma(totalAmount)}원 장바구니 보기 (${totalQuantity})`;
            viewCart.classList.remove("u-hidden");
        } else {
            viewCart.classList.add("u-hidden");
        }
    }

    async function refreshCartSummaryFromServer() {
        if (!document.getElementById("view-cart")) return;
        try {
            const res = await fetch("api/cart");
            if (!res.ok) return;
            const data = await res.json();
            renderCartButton(data);
        } catch (e) {
            console.error(e);
        }
    }

    function toggleCartBar(ordering) {
        const bar = document.getElementById("cart-bottombar");
        if (!bar) return;
        if (ordering) bar.classList.add("u-hidden");
        else bar.classList.remove("u-hidden");
    }

    function formatComma(n) {
        return Number(n ?? 0).toLocaleString("ko-KR");
    }

    function formatWon(n) {
        return `${formatComma(n)}원`;
    }
</script>
</body>
</html>
