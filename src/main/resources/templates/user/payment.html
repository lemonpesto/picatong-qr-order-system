<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>결제</title>

    <link rel="stylesheet" href="/css/user-unified.css" />
    <script src="https://kit.fontawesome.com/a3ff865f92.js" crossorigin="anonymous"></script>
</head>

<body class="user">
<div th:replace="~{fragments/nav :: nav(${navTitle}, null, ${tableNum}, false)}"></div>
<div th:replace="~{fragments/toast :: toast}"></div>

<div id="payment-page" class="user-center">
    <section class="user-center__content">
        <h3 class="user-center__title">
            총&nbsp;<span class="u-highlight" th:text="${#numbers.formatInteger(summary.totalAmount, 0, 'COMMA')}">0</span>원<br />
            아래 계좌로 지금 바로 입금해주세요!
        </h3>

        <div class="user-center__sub">
            <span class="user-account">
              <span id="account-number" class="user-account__number">3333226485597 카카오뱅크</span>
              <span> (김현수)</span><br />
            </span>

            <p style="margin-top: 8px">
              <span style="font-weight: 500">
                * 입금자명은 테이블 번호인
                <span class="u-highlight" style="font-weight: 700" th:text="${tableNum}">1</span>로 설정해 주세요
              </span>
            </p>
        </div>

    </section>

    <section class="user-center__actions">
        <div class="user-bottombar">
            <form th:action="@{/payments/{orderId}/cancel(orderId=${orderId})}" method="post" style="flex: 1;">
                <button type="submit" class="u-btn btn--cancel user-bottombar__btn" style="flex: 1;">
                    주문 취소
                </button>
            </form>

            <form th:action="@{/payments/{orderId}/confirm(orderId=${orderId})}" class="payment-form" method="post" style="flex: 2;">
                <button type="submit" class="u-btn u-btn--primary user-bottombar__btn">
                    총&nbsp;<span th:text="${#numbers.formatInteger(summary.totalAmount, 0, 'COMMA')}">0</span>원 입금 완료
                </button>
            </form>
        </div>
    </section>
</div>

<script th:src="@{/js/toast.js}"></script>
<script>
    window.addEventListener("DOMContentLoaded", () => {
        const account = document.getElementById("account-number");
        const toast = document.getElementById("toast");

        account?.addEventListener("click", async () => {
            const accountText = "3333226485597 카카오뱅크";

            // clipboard API 지원 여부 확인
            if (!navigator.clipboard) {
                // fallback: 구형 방식 사용
                try {
                    const textarea = document.createElement("textarea");
                    textarea.value = accountText;
                    textarea.style.position = "fixed";
                    textarea.style.opacity = "0";
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand("copy");
                    document.body.removeChild(textarea);

                    toast.textContent = "계좌번호가 복사됐어요";
                    toast.classList.add("show");
                    setTimeout(() => toast.classList.remove("show"), 2000);
                } catch (err) {
                    toast.textContent = "복사 실패: " + err.message;
                    toast.classList.add("show");
                    setTimeout(() => toast.classList.remove("show"), 2000);
                }
                return;
            }

            // clipboard API 사용
            try {
                await navigator.clipboard.writeText(accountText);
                toast.textContent = "계좌번호가 복사됐어요";
                toast.classList.add("show");
                setTimeout(() => toast.classList.remove("show"), 2000);
            } catch (err) {
                toast.textContent = "복사 실패: " + err.message;
                toast.classList.add("show");
                setTimeout(() => toast.classList.remove("show"), 2000);
            }
        });
    });
</script>
</body>
</html>
