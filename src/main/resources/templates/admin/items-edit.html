<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${pageTitle}">관리자 페이지</title>

    <link rel="stylesheet" th:href="@{/css/admin-unified.css}" />
    <script src="https://kit.fontawesome.com/a3ff865f92.js" crossorigin="anonymous"></script>
</head>

<body class="admin">
<!-- 공통 사이드바 & 상단바 -->
<div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>

<header class="admin-topbar">
    <i class="fas fa-bars admin-topbar__toggle" id="nav-bars"></i>
    <span class="admin-topbar__title" th:text="${pageTitle}">관리자 페이지</span>
</header>

<div th:replace="~{fragments/toast :: toast}"></div>
<!-- 공통 사이드바 & 상단바 끝 -->

<main class="admin-form-page">
    <div class="admin-form-page__header">
        <h3 class="admin-form-page__title">메뉴 수정</h3>

        <!-- 삭제 -->
        <form th:action="@{/admin/items/{id}/delete(id=${item.id})}" method="post" style="display:inline;">
            <button type="submit" class="btn btn--ghost-danger"
                    onclick="return confirm('정말 이 메뉴를 삭제하시겠습니까?')">삭제</button>
        </form>
    </div>

    <!-- 수정 폼 -->
    <form class="admin-form" th:action="@{/admin/items/{id}(id=${item.id})}" method="post">
        <label class="admin-form__label" for="name">아이템 이름 <span class="essential-input">*</span></label>
        <input class="admin-form__input" type="text" id="name" name="name" th:value="${item.name}" required />

        <label class="admin-form__label" for="price">가격 <span class="essential-input">*</span></label>
        <input class="admin-form__input"
               type="number" id="price" name="price" min="0"
               th:value="${item.price}" required />

        <label class="admin-form__label" for="categoryId">카테고리 <span class="essential-input">*</span></label>
        <select class="admin-form__select" id="categoryId" name="categoryId" required>
            <option th:each="cat : ${categories}"
                    th:value="${cat.id}"
                    th:text="${cat.name}"
                    th:selected="${item.category.id == cat.id}">
                ==카테고리 선택==
            </option>
        </select>

        <label class="admin-form__label" for="isActive">상태 <span class="essential-input">*</span></label>
        <select class="admin-form__select" id="isActive" name="isActive" required>
            <option value="true" th:selected="${item.isActive}">판매 중</option>
            <option value="false" th:selected="${!item.isActive}">품절</option>
        </select>

        <label class="admin-form__label" for="description">설명</label>
        <textarea class="admin-form__textarea" id="description" name="description" rows="3"
                  th:text="${item.description}"></textarea>

        <div class="admin-form__actions">
            <button type="submit" class="btn btn--primary">저장</button>
            <a th:href="@{/admin/items}" class="btn btn--cancel">취소</a>
        </div>
    </form>
</main>

<!-- 공통 스크립트 -->
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

<script th:src="@{/js/admin-sidebar.js}"></script>
<script th:src="@{/js/toast.js}"></script>
<!-- 공통 스크립트 끝 -->
</body>
</html>
