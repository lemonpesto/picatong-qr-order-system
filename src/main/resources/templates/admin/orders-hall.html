<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${pageTitle}">관리자 페이지</title>

    <link rel="stylesheet" th:href="@{/css/admin.css}" />

    <script src="https://kit.fontawesome.com/a3ff865f92.js" crossorigin="anonymous"></script>
</head>
<body>

<!-- 공통 사이드바 -->
<div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>

<div class="topbar">
    <i class="fas fa-bars" id="nav-bars"></i>
    <span class="page-title" th:text="${pageTitle}">관리자 페이지</span>
</div>

<div th:replace="~{fragments/toast :: toast}"></div>
<!-- 공통 사이드바 & 상단바 끝 -->

<div class="orders-container">

    <!-- 탭 네비게이션 -->
    <div class="hall-tabs">
        <a th:href="@{/admin/orders/hall}"
           class="hall-tab"
           th:classappend="${activeTab == 'confirm'} ? 'active' : ''">
            입금 확인
        </a>
        <a th:href="@{/admin/orders/hall/serve}"
           class="hall-tab"
           th:classappend="${activeTab == 'serve'} ? 'active' : ''">
            서빙
        </a>
    </div>

    <!-- 탭 1: 입금 확인 -->
    <div id="paid-list" class="order-list" th:if="${activeTab == 'confirm'}">

        <div th:if="${confirmOrders.isEmpty()}" class="empty-state">
            <p>확인할 주문이 없습니다.</p>
        </div>

        <div th:each="order : ${confirmOrders}" class="order-card"
             th:classappend="${order.status.name() == 'PAYMENT_PENDING'} ? 'pending' : 'waiting'"
             th:attr="data-order-id=${order.id}">

            <div class="order-header">
                <div>
                    <span class="table-badge" th:text="'테이블 ' + ${order.table.tableNum}">테이블 1</span>
                    <span class="status-badge"
                          th:classappend="${order.status.name() == 'PAYMENT_PENDING'} ? 'status-pending' : 'status-waiting'"
                          th:text="${order.status.name() == 'PAYMENT_PENDING'} ? '입금 중' : '입금 확인 대기'">
                        입금 중
                    </span>
                </div>
                <div class="timestamp" th:text="${#temporals.format(order.createdAt, 'HH:mm:ss')}">12:34:56</div>
            </div>

            <div class="order-items">
                <div th:each="oi : ${order.orderItems}" class="order-item">
                    <span class="item-name" th:text="${oi.item.name}">아이템명</span>
                    <span>
                        <span th:text="${oi.quantity}">1</span>개 ×
                        <span th:text="${#numbers.formatInteger(oi.orderPrice, 0, 'COMMA')}">10,000</span>원
                    </span>
                </div>
            </div>

            <div class="order-total">
                총 <span th:text="${#numbers.formatInteger(order.totalAmount, 0, 'COMMA')}">20,000</span>원
            </div>

            <!-- 입금 확인 / 주문 취소: 각각 별도 폼 (PRG) -->
            <div class="order-actions">
                <form th:action="@{/admin/orders/{orderId}/confirm(orderId=${order.id})}" method="post" style="display: inline;">
                    <button type="submit" class="btn btn-confirm"
                            onclick="return confirm('입금을 확인하시겠습니까?')">
                        입금 확인
                    </button>
                </form>
                <form th:action="@{/admin/orders/{orderId}/cancel(orderId=${order.id})}" method="post" style="display: inline;">
                    <button type="submit" class="btn btn-cancel"
                            onclick="return confirm('주문을 취소하시겠습니까?')">
                        주문 취소
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- 탭 2: 서빙 -->
    <div id="serve-list" class="order-list" th:if="${activeTab == 'serve'}">

        <div th:if="${serveOrders.isEmpty()}" class="empty-state">
            <p>서빙할 주문이 없습니다.</p>
        </div>

        <div th:each="order : ${serveOrders}" class="order-card" th:attr="data-order-id=${order.id}">
            <div class="order-header">
                <span class="table-num" th:text="'테이블 ' + ${order.table.tableNum}">테이블 1</span>
                <span class="time" th:text="${#temporals.format(order.createdAt, 'HH:mm:ss')}">12:34:56</span>
            </div>

            <ul class="order-items">
                <li th:each="oi : ${order.orderItems}">
                    <label>
                        <input type="checkbox"
                               class="serve-checkbox"
                               th:checked="false"
                               th:disabled="${oi.item.category.isManufactured ? !oi.cooked : false}"
                               th:attr="data-order-id=${order.id}, data-order-item-id=${oi.id}"
                               onchange="onServeCheckChanged(this)"/>
                        <span class="item-text">
                            <span th:text="${oi.item.name}">메뉴명</span>
                            <span th:text="' x' + ${oi.quantity}">x1</span>
                        </span>
                    </label>
                </li>
            </ul>

            <!-- 서빙 완료: 모든 체크박스가 다 활성화 될 때 버튼 활성화 -->
            <div class="serve-order-footer">
                <form th:action="@{/admin/orders/{orderId}/complete-serving(orderId=${order.id})}" method="post">
                    <button type="submit" class="btn-serve-complete"
                            th:attr="data-order-id=${order.id}"
                            disabled
                            onclick="return confirm('서빙이 완료되었습니까?')">
                        서빙 완료
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>


<!-- 공통 스크립트 -->
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

<script th:src="@{/js/admin-sidebar.js}"></script>
<script th:src="@{/js/toast.js}"></script>
<!-- 공통 스크립트 끝 -->

<script>
    const activeTab = /*[[${activeTab}]]*/ 'confirm';

    const socket = new SockJS('/ws');
    const stompClient = Stomp.over(socket);
    stompClient.debug = null;

    stompClient.connect({}, function() {

        // 1. 입금 확인 탭: /topic/admin/orders/hall 에서 RELOAD 오면 reload
        if (activeTab === 'confirm') {
            stompClient.subscribe('/topic/admin/orders/hall', function(message) {
                const evt = safeJson(message.body);
                if (evt && evt.type === 'RELOAD') {
                    window.location.reload();
                }
            });
        }

        // 2. 서빙 탭: /topic/admin/orders/serve 에서 RELOAD 오면 reload
        if (activeTab === 'serve') {
            stompClient.subscribe('/topic/admin/orders/serve', function(message) {
                const evt = safeJson(message.body);
                if (evt && evt.type === 'RELOAD') {
                    window.location.reload();
                }
            });

            // 3. 서빙 탭: 주문별 progress 구독 (주방 체크 → 서빙 체크/활성화 반영)
            //     WebSocketService.orderItemProgress: { orderId, orderItemId, checked }
            subscribeServeProgressTopics();
        }
    });

    // 서빙 탭: progress 구독
    function subscribeServeProgressTopics() {
        const orderCards = document.querySelectorAll('.order-card[data-order-id]');
        orderCards.forEach(function(card) {
            const orderId = card.getAttribute('data-order-id');
            if (!orderId) return;

            stompClient.subscribe('/topic/orders/' + orderId + '/progress', function(message) {
                const evt = safeJson(message.body);
                if (!evt) return;

                // evt: { orderId, orderItemId, checked }
                updateOrderItemCooked(evt.orderId, evt.orderItemId, evt.checked);
            });
        });
    }

    function updateOrderItemCooked(orderId, orderItemId, cooked) {
        const orderCard = document.querySelector('[data-order-id="' + orderId + '"]');
        if (!orderCard) return;

        const checkbox = orderCard.querySelector(
            'input.serve-checkbox[data-order-id="' + orderId + '"][data-order-item-id="' + orderItemId + '"]'
        );
        if (!checkbox) return;

        // 조리 완료된 아이템이면(cooked=true) 활성화, 조리 안 된 아이템이면(cooked=false) 비활성화(그리고 체크 해제)
        checkbox.disabled = !cooked;
        if (!cooked) checkbox.checked = false;

        // 간단한 하이라이트(선택)
        const label = checkbox.closest('label');
        if (label) {
            label.style.transition = 'background 0.3s';
            label.style.background = cooked ? '#d4edda' : '#f8d7da';
            setTimeout(function() { label.style.background = ''; }, 700);
        }

        updateCompleteButton(orderCard);
    }

    // 서빙 탭 버튼 활성화 규칙
    window.addEventListener('load', function() {
        if (activeTab !== 'serve') return;
        document.querySelectorAll('.order-card').forEach(function(card) {
            updateCompleteButton(card);
        });
    });

    function onServeCheckChanged(checkbox) {
        updateCompleteButton(checkbox.closest('.order-card'));
    }

    // 서빙 완료 버튼: 모든 체크박스가 활성화되면 활성화
    function updateCompleteButton(orderCard) {
        const btn = orderCard ? orderCard.querySelector('.btn-serve-complete') : null;
        if (!btn) return;

        const checkboxes = orderCard.querySelectorAll('.serve-checkbox');
        if (checkboxes.length === 0) {
            btn.disabled = true;
            return;
        }
        const allEnabled = Array.from(checkboxes).every(function(cb) { return !cb.disabled; });

        btn.disabled = !allEnabled;
    }

</script>
</body>
</html>
