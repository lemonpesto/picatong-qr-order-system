<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${pageTitle}">관리자 페이지</title>

    <link rel="stylesheet" th:href="@{/css/admin-unified.css}"/>
    <script src="https://kit.fontawesome.com/a3ff865f92.js" crossorigin="anonymous"></script>
</head>

<body class="admin">
<!-- 공통 사이드바 -->
<div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>

<header class="admin-topbar">
    <i class="fas fa-bars admin-topbar__toggle" id="nav-bars"></i>
    <span class="admin-topbar__title" th:text="${pageTitle}">관리자 페이지</span>
</header>

<div th:replace="~{fragments/toast :: toast}"></div>
<!-- 공통 사이드바 & 상단바 끝 -->

<main class="admin-container">

    <!-- 탭 네비게이션 -->
    <nav class="admin-hall-tabs">
        <a th:href="@{/admin/orders/hall}"
           class="admin-hall-tabs__tab"
           th:classappend="${activeTab == 'confirm'} ? ' admin-hall-tabs__tab--active' : ''">
            입금 확인
        </a>
        <a th:href="@{/admin/orders/hall/serve}"
           class="admin-hall-tabs__tab"
           th:classappend="${activeTab == 'serve'} ? ' admin-hall-tabs__tab--active' : ''">
            서빙
        </a>
    </nav>

    <!-- 탭 1: 입금 확인 -->
    <section id="paid-list" class="admin-order__list" th:if="${activeTab == 'confirm'}">

        <div th:if="${confirmOrders.isEmpty()}" class="admin-empty">
            <p>확인할 주문이 없습니다.</p>
        </div>

        <article th:each="order : ${confirmOrders}"
                 class="admin-card admin-card--soft js-order-card"
                 th:classappend="${order.status.name() == 'PAYMENT_PENDING'} ? '' : ' admin-card--accent-green'"
                 th:attr="data-order-id=${order.id}">

            <div class="admin-card__header">
                <div class="admin-order__left">
                    <span class="admin-order__table" th:text="'테이블 ' + ${order.table.tableNum}">테이블 1</span>
                    <div class="admin-card__meta" th:text="${#temporals.format(order.createdAt, 'HH:mm:ss')}">
                        12:34:56
                    </div>
                </div>
                <span class="admin-order__status"
                      th:classappend="${order.status.name() == 'PAYMENT_PENDING'} ? '' : ' admin-order__status--waiting'"
                      th:text="${order.status.name() == 'PAYMENT_PENDING'} ? '입금 중' : '입금 완료'">
                        입금 중
                </span>
            </div>

            <div class="admin-order__items">
                <div th:each="oi : ${order.orderItems}" class="admin-order__itemline">
                    <span class="admin-order__itemname" th:text="${oi.item.name}">아이템명</span>
                    <span>
                        <span th:text="${oi.quantity}">1</span>개 ×
                        <span th:text="${#numbers.formatInteger(oi.orderPrice, 0, 'COMMA')}">10,000</span>원
                    </span>
                </div>
            </div>

            <div class="admin-order__total">
                총&nbsp;<span th:text="${#numbers.formatInteger(order.totalAmount, 0, 'COMMA')}">20,000</span>원
            </div>

            <!-- 입금 확인 / 주문 취소 -->
            <div class="admin-order__actions admin-order__actions--confirm">
                <form th:action="@{/admin/orders/{orderId}/cancel(orderId=${order.id})}" method="post"
                      style="display:inline;">
                    <button type="submit"
                            class="btn js-btn-cancel"
                            th:classappend="${order.status.name() == 'PAYMENT_PENDING'} ? ' btn--cancel--pending' : ' btn--cancel--after'"
                            onclick="return confirm('주문을 취소하시겠습니까?')">
                        주문 취소
                    </button>
                </form>

                <form th:action="@{/admin/orders/{orderId}/confirm(orderId=${order.id})}" method="post"
                      style="display:inline;">
                    <button type="submit"
                            class="btn js-btn-confirm"
                            th:classappend="${order.status.name() == 'PAYMENT_PENDING'} ? ' btn--confirm--pending' : ' btn--confirm--waiting'"
                            onclick="return confirm('입금을 확인하시겠습니까?')">
                        입금 확인
                    </button>
                </form>
            </div>
        </article>
    </section>

    <!-- 탭 2: 서빙 -->
    <section id="serve-list" class="admin-order__list" th:if="${activeTab == 'serve'}">

        <div th:if="${serveOrders.isEmpty()}" class="admin-empty">
            <p>서빙할 주문이 없습니다.</p>
        </div>

        <article th:each="order : ${serveOrders}"
                 class="admin-card admin-card--soft js-serve-card"
                 th:attr="data-order-id=${order.id}">

            <div class="admin-card__header admin-order__header">
                <span class="admin-order__table" th:text="'테이블 ' + ${order.table.tableNum}">테이블 1</span>
                <span class="admin-card__meta"
                      th:text="${#temporals.format(order.createdAt, 'HH:mm:ss')}">12:34:56</span>
            </div>

            <ul class="admin-checklist">
                <li class="admin-checklist__row" th:each="oi : ${order.orderItems}">
                    <label class="admin-checklist__label">
                        <input type="checkbox"
                               class="admin-checklist__checkbox js-serve-checkbox"
                               th:checked="${oi.served}"
                               th:disabled="${oi.item.category.isManufactured ? !oi.cooked : false}"
                               th:attr="data-order-id=${order.id}, data-order-item-id=${oi.id}"
                               onchange="onServeCheckChanged(this)"/>
                        <span class="admin-checklist__text">
                            <span class="admin-checklist__name" th:text="${oi.item.name}">아이템명</span>
                            <span class="admin-checklist__qty" th:text="${oi.quantity} + '개'">1개</span>
                        </span>
                    </label>
                </li>
            </ul>

            <div style="margin-top:12px;">
                <button type="button"
                        class="btn btn--primary js-btn-serve-complete"
                        th:attr="data-order-id=${order.id}"
                        disabled
                        onclick="completeServeOrder(this)">
                    서빙 완료
                </button>
            </div>
        </article>
    </section>
</main>

<!-- 공통 스크립트 -->
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

<script th:src="@{/js/admin-sidebar.js}"></script>
<script th:src="@{/js/toast.js}"></script>
<script th:src="@{/js/api.js}"></script>
<!-- 공통 스크립트 끝 -->

<script th:inline="javascript">
    /* =========================================================
     *  State / Config
     * ========================================================= */
    const activeTab = /*[[${activeTab}]]*/ 'confirm';

    const WS = {
        url: '/ws',
        retryMs: 3000,
        topics: {
            hallReload: '/topic/admin/orders/hall',
            hallServeReload: '/topic/admin/orders/hall/serve',
            orderProgress: (orderItemId) => `/topic/orders/${orderItemId}/progress`,
            serveProgress: (orderItemId) => `/topic/serve/orders/${orderItemId}/progress`,
            serveComplete: (orderId) => `/topic/serve/orders/${orderId}/complete`,
        },
    };

    let sock = null;
    let stompClient = null;

    const subscribedProgress = new Set();
    const subscribedComplete = new Set();

    /* =========================================================
     *  Utils
     * ========================================================= */
    const safeJson = (str) => {
        try {
            return JSON.parse(str);
        } catch {
            return null;
        }
    };

    const isConfirmTab = () => activeTab === 'confirm';
    const isServeTab = () => activeTab === 'serve';

    const disconnectQuietly = () => {
        try {
            stompClient?.disconnect();
        } catch (e) {
        }
    };

    /* =========================================================
     *  WebSocket
     * ========================================================= */
    const connectWs = () => {
        sock = new SockJS(WS.url);
        stompClient = Stomp.over(sock);
        stompClient.debug = null;
        stompClient.reconnect_delay = WS.retryMs;

        stompClient.connect({}, onWsConnected, onWsError);

        sock.onclose = () => {
            console.warn('[WS] closed. retry in 3s');
            setTimeout(connectWs, WS.retryMs);
        };
    };

    const onWsConnected = () => {
        console.log('[WS] connected');
        subscribeReloadTopics();

        if (isServeTab()) {
            subscribeServeProgressTopics();
            subscribeServeCompleteTopics();
        }
    };

    const onWsError = (err) => {
        console.warn('[WS] connect error', err);
    };

    const subscribeReloadTopics = () => {
        const onReload = (message) => {
            const evt = safeJson(message.body);
            if (evt?.type === 'RELOAD') window.location.reload();
        };

        stompClient.subscribe(WS.topics.hallReload, onReload);
        stompClient.subscribe(WS.topics.hallServeReload, onReload);
    };

    const subscribeServeProgressTopics = () => {
        document
            .querySelectorAll('#serve-list input.js-serve-checkbox[data-order-item-id]')
            .forEach((cb) => {
                const orderItemId = cb.getAttribute('data-order-item-id');
                if (!orderItemId) return;

                if (subscribedProgress.has(orderItemId)) return;
                subscribedProgress.add(orderItemId);

                // 주방->서빙 조리완료 동기화
                stompClient.subscribe(WS.topics.orderProgress(orderItemId), (message) => {
                    const evt = safeJson(message.body);
                    if (!evt) return;

                    updateOrderItemCooked(evt.orderId, evt.orderItemId, evt.checked);
                });

                // 서빙 페이지 내 실시간 동기화
                stompClient.subscribe(WS.topics.serveProgress(orderItemId), (message) => {
                    const evt = safeJson(message.body);
                    if (!evt) return;

                    updateOrderItemServed(evt.orderId, evt.orderItemId, evt.checked);
                });
            });
    };

    const subscribeServeCompleteTopics = () => {
        document
            .querySelectorAll('#serve-list .js-serve-card[data-order-id]')
            .forEach((card) => {
                const orderId = card.getAttribute('data-order-id');
                if (!orderId) return;

                if (subscribedComplete.has(orderId)) return;
                subscribedComplete.add(orderId);

                stompClient.subscribe(WS.topics.serveComplete(orderId), (message) => {
                    const evt = safeJson(message.body);
                    if (!evt) return;

                    const doneOrderId = evt?.data?.orderId;
                    if (evt.type === 'COMPLETED' && doneOrderId) {
                        removeOrderCard(doneOrderId);
                    }
                });
            });
    };

    const removeOrderCard = (orderId) => {
        const orderCard = document.querySelector(`.js-serve-card[data-order-id="${orderId}"]`);
        if (!orderCard) return;

        orderCard.style.transition = 'opacity 0.3s';
        orderCard.style.opacity = '0';
        setTimeout(() => orderCard.remove(), 300);
    };

    /* =========================================================
     *  UI: Confirm tab
     * ========================================================= */
    const updateConfirmButtons = () => {
        if (!isConfirmTab()) return;

        document
            .querySelectorAll('#paid-list .js-order-card[data-order-id]')
            .forEach((card) => {
                // admin-card--accent-green이면 waiting 상태로 보자
                const isAfterPaymentPending = card.classList.contains('admin-card--accent-green');

                const confirmBtn = card.querySelector('button.js-btn-confirm');
                const cancelBtn = card.querySelector('button.js-btn-cancel');

                if (confirmBtn) {
                    confirmBtn.classList.toggle('btn--confirm--pending', !isAfterPaymentPending);
                    confirmBtn.classList.toggle('btn--confirm--after', isAfterPaymentPending);
                }

                if (cancelBtn) {
                    cancelBtn.classList.toggle('btn--cancel--pending', !isAfterPaymentPending);
                    cancelBtn.classList.toggle('btn--cancel--after', isAfterPaymentPending);
                }
            });
    };

    /* =========================================================
     *  UI: Serve tab
     * ========================================================= */
    const updateServeCompleteButtons = () => {
        if (!isServeTab()) return;
        document.querySelectorAll('#serve-list .js-serve-card').forEach(updateCompleteButton);
    };

    const onServeCheckChanged = async (checkbox) => {
        const card = checkbox?.closest('.js-serve-card');
        if (card) updateCompleteButton(card);

        // AJAX로 서버에 서빙 상태 전송
        const orderId = checkbox.getAttribute('data-order-id');
        const orderItemId = checkbox.getAttribute('data-order-item-id');
        const isChecked = checkbox.checked;

        const endpoint = isChecked
            ? `/admin/orders/${orderId}/items/${orderItemId}/serve`
            : `/admin/orders/${orderId}/items/${orderItemId}/unserve`;

        try {
            const res = await fetch(endpoint, {
                method: 'POST',
                headers: {Accept: 'application/json'},
            });
            if (!res.ok) {
                const errMsg = await ApiUtils.readErrorMessage(res);
                throw new Error(errMsg || '서빙 상태 업데이트 실패');
            }
        } catch (err) {
            console.error('서빙 상태 업데이트 실패:', err);
            showToast(err?.message || '서빙 상태 업데이트 실패');
        }
    };

    const completeServeOrder = async (button) => {
        if (!confirm('서빙이 완료되었습니까?')) return;

        const orderId = button?.getAttribute('data-order-id');
        if (!orderId) return;

        const url = `/admin/orders/${orderId}/complete`;

        const prev = button.disabled;
        button.disabled = true;
        try {
            const res = await fetch(url, {
                method: 'POST',
                headers: {Accept: 'application/json'},
            });
            if (!res.ok) {
                const errMsg = await ApiUtils.readErrorMessage(res);
                throw new Error(errMsg || '오류가 발생했습니다.');
            }

            const data = await res.json();
            if (data?.message) showToast(data.message);
        } catch (err) {
            console.error(err);
            showToast(err?.message || '오류가 발생했습니다.');
        } finally {
            button.disabled = prev;
        }
    };

    const updateOrderItemServed = (orderId, orderItemId, served) => {
        const orderCard = document.querySelector(`.js-serve-card[data-order-id="${orderId}"]`);
        if (!orderCard) return;

        const checkbox = orderCard.querySelector(
            `input.js-serve-checkbox[data-order-id="${orderId}"][data-order-item-id="${orderItemId}"]`
        );
        if (!checkbox) return;

        checkbox.checked = served;
        updateCompleteButton(orderCard);
    };

    const updateOrderItemCooked = (orderId, orderItemId, cooked) => {
        const orderCard = document.querySelector(`.js-serve-card[data-order-id="${orderId}"]`);
        if (!orderCard) return;

        const checkbox = orderCard.querySelector(
            `input.js-serve-checkbox[data-order-id="${orderId}"][data-order-item-id="${orderItemId}"]`
        );
        if (!checkbox) return;

        checkbox.disabled = !cooked;
        if (!cooked) checkbox.checked = false;

        // cooked=false일 때만 하이라이트
        const label = checkbox.closest('label');
        if (label && !cooked) {
            label.style.transition = 'background 0.3s';
            label.style.background = '#f8d7da';
            setTimeout(() => {
                label.style.background = '';
            }, 700);
        }

        updateCompleteButton(orderCard);
    };

    const updateCompleteButton = (orderCard) => {
        const btn = orderCard?.querySelector('.js-btn-serve-complete');
        if (!btn) return;

        const checkboxes = orderCard.querySelectorAll('.js-serve-checkbox');
        if (checkboxes.length === 0) {
            btn.disabled = true;
            orderCard.classList.remove('admin-card--accent-blue');
            return;
        }

        const allEnabled = Array.from(checkboxes).every((cb) => !cb.disabled);
        btn.disabled = !allEnabled;

        // ready 강조(파란 테두리)
        orderCard.classList.toggle('admin-card--accent-blue', allEnabled);
    };

    /* =========================================================
     *  Entry / Bindings
     * ========================================================= */
    document.addEventListener('DOMContentLoaded', () => {
        updateConfirmButtons();
        updateServeCompleteButtons();
    });

    window.addEventListener('load', () => {
        connectWs();
    });

    window.addEventListener('beforeunload', disconnectQuietly);

    window.onServeCheckChanged = onServeCheckChanged;
    window.completeServeOrder = completeServeOrder;
</script>

</body>
</html>
