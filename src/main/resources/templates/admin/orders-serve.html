<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${pageTitle}">관리자 페이지</title>

    <link rel="stylesheet" th:href="@{/css/admin.css}" />

    <script src="https://kit.fontawesome.com/a3ff865f92.js" crossorigin="anonymous"></script>
</head>
<body>

<!-- 공통 사이드바 -->
<div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>

<div class="topbar">
    <i class="fas fa-bars" id="nav-bars"></i>
    <span class="page-title" th:text="${pageTitle}">관리자 페이지</span>
</div>
<!-- 공통 사이드바 & 상단바 끝 -->

<div class="server-page">
    <div th:if="${orders.isEmpty()}" class="inline-action">
        <p>서빙할 주문이 없습니다</p>
    </div>

    <div th:each="order : ${orders}" class="order-card" th:attr="data-order-id=${order.id}">
        <div class="order-header">
            <span class="table-num" th:text="'테이블 ' + ${order.table.tableNum}">테이블 1</span>
            <span class="time" th:text="${#temporals.format(order.createdAt, 'HH:mm:ss')}">12:34:56</span>
        </div>

        <ul class="order-items">
            <li th:each="item : ${order.orderItems}">
                <label>
                    <input type="checkbox"
                           class="serve-checkbox"
                           th:checked="false"
                           th:disabled="${item.item.category.isManufactured ? !item.cooked : false}"
                           th:attr="data-order-id=${order.id}, data-item-id=${item.item.id}"
                           onchange="checkAllServed(this)"/>
                    <span class="item-text">
                        <span th:text="${item.item.name}">메뉴명</span>
                        <span th:text="' x' + ${item.quantity}">x1</span>
                    </span>
                </label>
            </li>
        </ul>

        <div class="serve-order-footer">
            <button class="btn-serve-complete"
                    th:attr="data-order-id=${order.id}"
                    disabled
                    onclick="completeServing(this)">
                서빙 완료
            </button>
        </div>
    </div>
</div>

<!-- 공통 스크립트 -->
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

<script th:src="@{/js/admin-sidebar.js}"></script>
<script th:src="@{/js/toast.js}"></script>
<!-- 공통 스크립트 끝 -->

<script>

    // WebSocket 연결
    const socket = new SockJS('/ws');
    const stompClient = Stomp.over(socket);

    stompClient.connect({}, function(frame) {
        console.log('서빙 페이지 WebSocket 연결됨');

        // 조리 완료된 주문 알림 (주방에서 전체 완료 버튼 누름)
        stompClient.subscribe('/topic/orderCompleted', function(message) {
            console.log('조리 완료 주문 도착');
            location.reload();
        });

        // 개별 아이템 조리 완료 상태 변경 알림
        stompClient.subscribe('/topic/itemCooked', function(message) {
            const data = JSON.parse(message.body);
            console.log('아이템 상태 변경:', data);

            updateItemCheckbox(data.orderId, data.itemId, data.cooked);
        });
    });

    // 페이지 로드 시 모든 주문의 버튼 상태 체크
    document.addEventListener('DOMContentLoaded', function() {
        document.querySelectorAll('.order-card').forEach(card => {
            updateCompleteButton(card);
        });
    });

    // 실시간으로 체크박스 상태 업데이트
    function updateItemCheckbox(orderId, itemId, cooked) {
        const orderCard = document.querySelector(`[data-order-id="${orderId}"]`);
        if (!orderCard) return;

        const checkbox = orderCard.querySelector(
            `input[data-order-id="${orderId}"][data-item-id="${itemId}"]`
        );

        if (checkbox) {
            // 조리 완료된 아이템 -> 활성화
            checkbox.disabled = cooked;

            // 시각적 피드백
            const label = checkbox.closest('label');
            if (cooked) {
                label.style.transition = 'background 0.3s';
                label.style.background = '#d4edda';
                setTimeout(() => {
                    label.style.background = '';
                }, 1000);
            }

            // 버튼 상태 업데이트
            updateCompleteButton(orderCard);
        }
    }

    // 체크박스 체크 시 버튼 상태 확인
    function checkAllServed(checkbox) {
        const orderCard = checkbox.closest('.order-card');
        updateCompleteButton(orderCard);
    }

    // '서빙 완료' 버튼 활성화 여부 업데이트
    function updateCompleteButton(orderCard) {
        const completeBtn = orderCard.querySelector('.btn-serve-complete');
        const checkboxes = orderCard.querySelectorAll('.serve-checkbox');

        // 모든 체크박스가 체크되어 있는지 확인
        const allChecked = Array.from(checkboxes).every(cb => cb.checked);

        completeBtn.disabled = !allChecked;
    }

    // 서빙 완료
    async function completeServing(button) {
        const orderId = button.getAttribute('data-order-id');

        if (!confirm('서빙이 완료되었습니까?')) return;

        try {
            const response = await fetch(`/admin/orders/${orderId}/complete-serving`, {
                method: 'POST'
            });
            const result = await response.json();

            if (result.success) {
                const card = button.closest('.order-card');
                card.style.transition = 'opacity 0.3s';
                card.style.opacity = '0';
                setTimeout(() => card.remove(), 300);
            } else {
                alert('처리 실패: ' + result.message);
            }
        } catch (error) {
            console.error('Error:', error);
            alert('오류가 발생했습니다: ' + error);
        }
    }
</script>
</body>
</html>
