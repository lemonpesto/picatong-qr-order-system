<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${pageTitle}">관리자 페이지</title>

    <link rel="stylesheet" th:href="@{/css/admin-unified.css}" />
    <script src="https://kit.fontawesome.com/a3ff865f92.js" crossorigin="anonymous"></script>
</head>

<body class="admin">
<!-- 공통 사이드바 -->
<div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>

<header class="admin-topbar">
    <i class="fas fa-bars admin-topbar__toggle" id="nav-bars"></i>
    <span class="admin-topbar__title" th:text="${pageTitle}">관리자 페이지</span>
</header>
<!-- 공통 사이드바 & 상단바 끝 -->

<main class="admin-container">
    <section id="history-list" class="admin-order__list">
        <article th:each="order : ${orders}"
                 class="admin-card admin-card--soft"
                 th:attr="data-table=${order.table.tableNum}">

            <div class="admin-card__header admin-order__header">
                <div class="admin-order__left">
                    <span class="admin-order__table" th:text="'테이블 ' + ${order.table.tableNum}">테이블 1</span>
                    <span class="admin-card__meta" th:text="${#temporals.format(order.createdAt, 'MM/dd HH:mm')}">
                        01/20 12:34
                    </span>
                </div>

                <span class="admin-order__status"
                      th:classappend="${ order.status.name() == 'COMPLETED' } ? 'completed' : (${order.status.name() == 'CANCELLED'} ? 'cancelled' : '')"
                      th:text="${order.status.description}">
                    상태
                </span>
            </div>

            <ul class="admin-order__items">
                <li th:each="oi : ${order.orderItems}" class="admin-order__itemline">
                    <span class="admin-order__itemname" th:text="${oi.item.name}">아이템명</span>
                    <span>
                        <span th:text="${oi.quantity}">1</span>개 ×
                        <span th:text="${#numbers.formatInteger(oi.orderPrice, 0, 'COMMA')}">10,000</span>원
                    </span>
                </li>
            </ul>

            <div class="admin-order__total">
                총&nbsp;<span th:text="${#numbers.formatInteger(order.totalAmount, 0, 'COMMA')} + '원'">10,000원</span>
            </div>
        </article>
    </section>
</main>

<!-- 공통 스크립트 -->
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

<script th:src="@{/js/admin-sidebar.js}"></script>
<script th:src="@{/js/toast.js}"></script>
<!-- 공통 스크립트 끝 -->

<script>
    // (옵션) 테이블 필터링 UI가 생겼을 때를 대비해 남겨둠.
    const filterBtns = document.querySelectorAll('.filter-btn');
    const orderCards = document.querySelectorAll('[data-table]');

    filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            const tableNum = btn.getAttribute('data-table');

            filterBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            orderCards.forEach(card => {
                if (tableNum === 'all' || card.getAttribute('data-table') === tableNum) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        });
    });
</script>
</body>
</html>
