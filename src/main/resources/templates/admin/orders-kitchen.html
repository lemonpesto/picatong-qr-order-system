<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${pageTitle}">관리자 페이지</title>

    <link rel="stylesheet" th:href="@{/css/admin-unified.css}" />
    <script src="https://kit.fontawesome.com/a3ff865f92.js" crossorigin="anonymous"></script>
</head>

<body class="admin">
<!-- 공통 사이드바 -->
<div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>

<header class="admin-topbar">
    <i class="fas fa-bars admin-topbar__toggle" id="nav-bars"></i>
    <span class="admin-topbar__title" th:text="${pageTitle}">관리자 페이지</span>
</header>

<div th:replace="~{fragments/toast :: toast}"></div>
<!-- 공통 사이드바 & 상단바 끝 -->

<main class="admin-container" style="padding-top:16px;">
    <section class="admin-order__list">
        <div th:if="${orders.isEmpty()}" class="admin-empty">
            <p>조리할 주문이 없습니다</p>
        </div>

        <article th:each="order : ${orders}"
                 class="admin-card admin-card--soft js-kitchen-card"
                 th:attr="data-order-id=${order.orderId}">

            <div class="admin-card__header admin-order__header">
                <span class="admin-order__table" th:text="'테이블 ' + ${order.tableNum}">테이블 1</span>
                <span class="admin-card__meta"
                      th:text="${order.confirmedAt != null ? #temporals.format(order.confirmedAt, 'HH:mm:ss') : '-'}">
                    12:34:56
                </span>
            </div>

            <ul class="admin-checklist">
                <li class="admin-checklist__row" th:each="oi : ${order.manufacturedItems}">
                    <label class="admin-checklist__label">
                        <input type="checkbox"
                               class="admin-checklist__checkbox js-cook-checkbox"
                               th:checked="${oi.cooked}"
                               th:attr="data-order-id=${order.orderId}, data-order-item-id=${oi.id}"
                               onchange="toggleCooked(this)"/>
                        <span class="admin-checklist__text">
                            <span class="admin-checklist__name" th:text="${oi.item.name}">메뉴명</span>
                            <span class="admin-checklist__qty" th:text="${oi.quantity} + '개'">1개</span>
                        </span>
                    </label>
                </li>
            </ul>

            <div style="margin-top:12px;">
                <button type="button"
                        class="btn btn--dark js-btn-complete"
                        th:attr="data-order-id=${order.orderId}"
                        onclick="completeKitchenOrder(this)">
                    조리 완료
                </button>
            </div>
        </article>
    </section>
</main>

<!-- 공통 스크립트 -->
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

<script th:src="@{/js/admin-sidebar.js}"></script>
<script th:src="@{/js/toast.js}"></script>
<!-- 공통 스크립트 끝 -->

<script th:inline="javascript">
    /* =========================================================
    * Config
    * ========================================================= */
    const WS = {
        url: '/ws',
        topic: '/topic/admin/kitchen/orders',
        kitchenProgress: (orderItemId) => `/topic/kitchen/orders/${orderItemId}/progress`,
        kitchenComplete: (orderId) => `/topic/kitchen/orders/${orderId}/complete`,
    };

    let stompClient = null;
    const subscribedProgress = new Set();
    const subscribedComplete = new Set();

    /* =========================================================
    * Utils
    * ========================================================= */
    const safeJson = (str) => {
        try { return JSON.parse(str); } catch { return null; }
    };

    const postJson = async (url) => {
        const res = await fetch(url, {method: 'POST'});
        const text = await res.text();
        const data = safeJson(text);

        if (!res.ok) throw new Error(data?.message || text || `HTTP ${res.status}`);
        if (!data) throw new Error('서버 응답이 올바르지 않습니다.');
        return data;
    };

    const disableWhile = async (el, fn) => {
        if (!el) return fn();
        const prev = el.disabled;
        el.disabled = true;
        try { return await fn(); }
        finally { el.disabled = prev; }
    };

    /* =========================================================
    * WebSocket (reload trigger)
    * ========================================================= */
    const connectKitchenReloadWs = () => {
        const socket = new SockJS(WS.url);
        stompClient = Stomp.over(socket);
        stompClient.debug = null;

        stompClient.connect({}, () => {
            // 페이지 전체 reload 토픽
            stompClient.subscribe(WS.topic, (message) => {
                const evt = safeJson(message.body);
                if (!evt || evt.type === 'RELOAD') window.location.reload();
            });

            // 개별 아이템 조리 상태 실시간 동기화
            subscribeKitchenProgressTopics();
            // 전체 조리 완료 실시간 동기화
            subscribeKitchenCompleteTopics();
        });

        window.addEventListener('beforeunload', () => {
            try { stompClient.disconnect(); } catch (e) {}
        });
    };

    const subscribeKitchenProgressTopics = () => {
        document
            .querySelectorAll('.js-cook-checkbox[data-order-item-id]')
            .forEach((cb) => {
                const orderItemId = cb.getAttribute('data-order-item-id');
                if (!orderItemId) return;

                if (subscribedProgress.has(orderItemId)) return;
                subscribedProgress.add(orderItemId);

                stompClient.subscribe(WS.kitchenProgress(orderItemId), (message) => {
                    const evt = safeJson(message.body);
                    if (!evt) return;

                    updateOrderItemCooked(evt.orderId, evt.orderItemId, evt.checked);
                });
            });
    };

    const subscribeKitchenCompleteTopics = () => {
        document
            .querySelectorAll('.js-kitchen-card[data-order-id]')
            .forEach((card) => {
                const orderId = card.getAttribute('data-order-id');
                if (!orderId) return;

                if (subscribedComplete.has(orderId)) return;
                subscribedComplete.add(orderId);

                stompClient.subscribe(WS.kitchenComplete(orderId), (message) => {
                    const evt = safeJson(message.body);
                    if (!evt) return;

                    const doneOrderId = evt?.data?.orderId;
                    if (evt.type === 'COMPLETED' && doneOrderId) {
                        removeOrderCard(doneOrderId);
                    }
                });
            });
    };

    const removeOrderCard = (orderId) => {
        const orderCard = document.querySelector(`.js-kitchen-card[data-order-id="${orderId}"]`);
        if (!orderCard) return;

        orderCard.style.transition = 'opacity 0.3s';
        orderCard.style.opacity = '0';
        setTimeout(() => orderCard.remove(), 300);
    };

    const updateOrderItemCooked = (orderId, orderItemId, cooked) => {
        const orderCard = document.querySelector(`.js-kitchen-card[data-order-id="${orderId}"]`);
        if (!orderCard) return;

        const checkbox = orderCard.querySelector(
            `input.js-cook-checkbox[data-order-id="${orderId}"][data-order-item-id="${orderItemId}"]`
        );
        if (!checkbox) return;

        checkbox.checked = cooked;
    };

    /* =========================================================
    * Handlers
    * ========================================================= */
    const toggleCooked = async (checkbox) => {
        const orderId = checkbox?.getAttribute('data-order-id');
        const orderItemId = checkbox?.getAttribute('data-order-item-id');
        const isCooked = !!checkbox?.checked;

        if (!orderId || !orderItemId || !checkbox) return;

        const url = isCooked
            ? `/admin/kitchen/orders/${orderId}/items/${orderItemId}/cook`
            : `/admin/kitchen/orders/${orderId}/items/${orderItemId}/uncook`;

        await disableWhile(checkbox, async () => {
            try {
                const result = await postJson(url);
                if (!result.success) {
                    alert('처리 실패: ' + (result.message || 'unknown'));
                    checkbox.checked = !isCooked;
                }
            } catch (err) {
                console.error(err);
                alert('오류가 발생했습니다: ' + (err?.message || err));
                checkbox.checked = !isCooked;
            }
        });
    };

    const completeKitchenOrder = async (button) => {
        if (!confirm('조리가 완료되었습니까?')) return;

        const orderId = button?.getAttribute('data-order-id');
        if (!orderId) return;

        const url = `/admin/kitchen/orders/${orderId}/complete`;

        await disableWhile(button, async () => {
            try {
                await fetch(url, { method: 'POST' });
                // WebSocket으로 실시간 동기화됨
            } catch (err) {
                console.error(err);
                alert('오류가 발생했습니다: ' + (err?.message || err));
            }
        });
    };

    document.addEventListener('DOMContentLoaded', () => {
        connectKitchenReloadWs();
    });

    window.toggleCooked = toggleCooked;
    window.completeKitchenOrder = completeKitchenOrder;
</script>
</body>
</html>
