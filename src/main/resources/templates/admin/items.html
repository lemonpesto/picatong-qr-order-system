<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${pageTitle}">관리자 페이지</title>

    <link rel="stylesheet" th:href="@{/css/admin-unified.css}"/>
    <script src="https://kit.fontawesome.com/a3ff865f92.js" crossorigin="anonymous"></script>
</head>

<body class="admin">
<!-- 공통 사이드바 & 상단바 -->
<div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>

<div class="admin-topbar">
    <i class="fas fa-bars admin-topbar__toggle" id="nav-bars"></i>
    <span class="admin-topbar__title" th:text="${pageTitle}">관리자 페이지</span>
</div>

<div th:replace="~{fragments/toast :: toast}"></div>

<!-- 카테고리 목차 (user/items와 동일한 방식) -->
<div class="admin-tabs" th:if="${!#lists.isEmpty(categories)}">
    <button
            class="admin-tabs__btn js-category-btn"
            th:each="cat : ${categories}"
            th:attr="data-target=${'section-' + cat.id}"
            th:text="${cat.name}"
    >
        카테고리
    </button>
</div>

<!-- 메뉴 리스트 -->
<div th:if="${#lists.isEmpty(categories)}" class="admin-container">
    <p class="u-muted">카테고리가 없습니다.</p>
</div>

<main class="admin-section admin-section--menu">
    <span class="u-divider"></span>

    <div class="admin-grid">
        <!-- 새 메뉴 추가 카드 -->
        <a th:href="@{/admin/items/new}" class="admin-menu-card admin-menu-card--new js-menu-card-new">
            <i class="fas fa-plus"></i>
            <span>새 메뉴 추가</span>
        </a>
    </div>

    <!-- ✅ 카테고리별 섹션 (각 섹션 제목에 카테고리명 표시) -->
    <div th:each="cat, cstat : ${categories}">
        <section th:attr="id=${'section-' + cat.id}" class="admin-menu__section">
            <h3 class="admin-menu__title" th:text="${cat.name}">카테고리명</h3>

            <!-- 해당 카테고리에 속한 아이템만 출력 -->
            <div class="admin-grid">
                <div th:each="item : ${items}"
                     th:if="${item.category != null and item.category.id == cat.id}"
                     class="admin-menu-card js-menu-card"
                     th:data-category="${cat.id}">
                    <div class="admin-menu-card__header">
                        <h3 class="admin-menu-card__title" th:text="${item.name}">메뉴명</h3>
                        <a th:href="@{/admin/items/{id}/edit(id=${item.id})}" class="admin-menu-card__edit"
                           aria-label="edit">
                            <i class="fas fa-edit"></i>
                        </a>
                    </div>

                    <p class="admin-menu-card__price"
                       th:text="${#numbers.formatInteger(item.price, 0, 'COMMA')} + '원'">
                        0원
                    </p>

                    <p class="admin-menu-card__desc" th:text="${item.description}">설명</p>

                    <p class="admin-menu-card__status"
                       th:classappend="${item.isActive} ? 'status--on' : 'status--off'"
                       th:text="${item.isActive} ? '판매 중' : '품절'">
                        판매 중
                    </p>
                </div>
            </div>
        </section>

        <span class="u-divider" th:if="${!cstat.last}"></span>
    </div>

</main>

<!-- 공통 스크립트 -->
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

<script th:src="@{/js/admin-sidebar.js}"></script>
<script th:src="@{/js/toast.js}"></script>
<!-- 공통 스크립트 끝 -->

<script>
    function bindAdminCategoryScroll() {
        const tabsEl = document.querySelector(".admin-tabs");

        document.querySelectorAll(".js-category-btn").forEach((btn) => {
            btn.addEventListener("click", () => {
                document.querySelectorAll(".js-category-btn")
                    .forEach(b => b.classList.remove("admin-tabs__btn--active"));
                btn.classList.add("admin-tabs__btn--active");

                const id = btn.dataset.target;
                const section = document.getElementById(id);
                if (!section) return;

                const tabsBottom = tabsEl ? tabsEl.getBoundingClientRect().bottom : 0;
                const sectionTopOnPage = section.getBoundingClientRect().top + window.scrollY;
                const targetY = sectionTopOnPage - tabsBottom;

                window.scrollTo({
                    top: Math.max(0, targetY),
                    behavior: "smooth",
                });
            });
        });
    }

    document.addEventListener("DOMContentLoaded", () => {
        bindAdminCategoryScroll();
    });

    // WebSocket 연결 (기존 로직 유지)
    const socket = new SockJS('/ws');
    const stompClient = Stomp.over(socket);

    stompClient.debug = null;
    stompClient.connect({}, function () {
        stompClient.subscribe('/topic/menuAdded', function () {
            location.reload();
        });
        stompClient.subscribe('/topic/menuUpdated', function () {
            location.reload();
        });
        stompClient.subscribe('/topic/menuDeleted', function () {
            location.reload();
        });
    });
</script>
</body>
</html>
