<div th:fragment="toast">
    <div id="toast" class="toast"></div>
    <script th:inline="javascript">
        /*<![CDATA[*/
        const successMsg = /*[[${successMessage}]]*/ null;
        const errorMsg = /*[[${errorMessage}]]*/ null;

        if (successMsg) {
            setTimeout(() => showToast(successMsg), 100);
        }
        if (errorMsg) {
            setTimeout(() => showToast(errorMsg), 100);
        }
        /*]]>*/
    </script>
</div>
