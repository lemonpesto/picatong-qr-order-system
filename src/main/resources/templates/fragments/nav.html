<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<nav class="user-nav" th:fragment="nav(navTitle, navBack, tableNum, showHistory)">
    <!-- navBack이 있으면: 뒤로가기 + 타이틀 -->
    <div class="user-nav__left">
        <a th:if="${navBack != null}"
           th:href="${navBack}"
           class="user-nav__back"
           aria-label="back">
            <i class="fa-solid fa-chevron-left"></i>
        </a>

        <!-- 타이틀 -->
        <div class="user-nav__title"
           th:text="${navTitle != null ? navTitle : '피카통'}">
            피카통
        </div>
    </div>

    <!-- 오른쪽 영역(주문내역 / 테이블)-->
    <div class="user-nav__right">
        <a class="user-nav__link"
           th:if="${returnUrl != null}"
           th:href="@{/orders/history(returnUrl=${returnUrl})}">
            주문내역
        </a>
        <div class="user-nav__table">
            테이블<span class="user-nav__table-num" th:text="${tableNum}">1</span>
        </div>
    </div>

</nav>
</body>
</html>
